<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alevín D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
<style>
  :root{
    --azul:#1d4ed8; --azul-osc:#1e3a8a; --gris:#f4f5f7; --borde:#d8dbe0;
    --texto:#1f2430; --verde:#15803d; --rojo:#b91c1c;
  }
  *{box-sizing:border-box;}
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:var(--gris);color:var(--texto);}
  header{background:var(--azul-osc);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
  header h1{font-size:18px;margin:0;}
  nav{display:flex;gap:6px;}
  nav button{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:14px;}
  nav button.activo{background:#fff;color:var(--azul-osc);font-weight:600;}
  main{max-width:900px;margin:0 auto;padding:16px;}
  .card{background:#fff;border:1px solid var(--borde);border-radius:8px;padding:16px;margin-bottom:16px;}
  h2{margin-top:0;font-size:17px;}
  h3{font-size:15px;margin:14px 0 8px;}
  label{display:block;font-size:12px;color:#555;margin-bottom:2px;}
  input,select{padding:6px 8px;border:1px solid var(--borde);border-radius:5px;font-size:14px;width:100%;}
  .fila{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px;}
  .fila > div{flex:1;min-width:120px;}
  button.btn{background:var(--azul);color:#fff;border:none;padding:7px 14px;border-radius:6px;cursor:pointer;font-size:14px;}
  button.btn.sec{background:#fff;color:var(--azul);border:1px solid var(--azul);}
  button.btn.danger{background:#fff;color:var(--rojo);border:1px solid var(--rojo);}
  button.chip-x{background:none;border:none;color:#b91c1c;cursor:pointer;font-weight:bold;margin-left:4px;}
  table{width:100%;border-collapse:collapse;font-size:14px;}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--borde);}
  .badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px;background:#e5e7eb;}
  .badge.fijo{background:#dbeafe;color:var(--azul-osc);}
  .badge.temporal{background:#fef3c7;color:#92400e;}
  .badge.amistoso{background:#e5e7eb;}
  .badge.liga{background:#dcfce7;color:var(--verde);}
  .linea-box{border:1px dashed var(--borde);border-radius:6px;padding:10px;margin-bottom:10px;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0;}
  .chip{background:var(--gris);border:1px solid var(--borde);border-radius:20px;padding:4px 10px;font-size:13px;display:flex;align-items:center;}
  .chip input{width:70px;border:none;background:transparent;padding:0;margin-left:6px;font-size:12px;color:#555;}
  .partido-item{cursor:pointer;padding:10px;border-bottom:1px solid var(--borde);}
  .partido-item:hover{background:var(--gris);}
  .oculto{display:none !important;}
  .aviso{background:#fef2f2;border:1px solid #fecaca;color:var(--rojo);padding:8px 10px;border-radius:6px;font-size:13px;margin-bottom:10px;}
  .ok{background:#f0fdf4;border:1px solid #bbf7d0;color:var(--verde);padding:8px 10px;border-radius:6px;font-size:13px;margin-bottom:10px;}
  .muted{color:#777;font-size:13px;}
  .volver{background:none;border:none;color:var(--azul);cursor:pointer;font-size:14px;margin-bottom:10px;padding:0;}
  .tabla-wrap{overflow-x:auto;}
  .spinner{display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:girar .6s linear infinite;vertical-align:middle;margin-right:6px;opacity:.85;}
  @keyframes girar{to{transform:rotate(360deg);}}
  .campo{background:linear-gradient(#1f8a3d,#166b30);border-radius:8px;padding:10px 6px;margin-bottom:10px;}
  .campo-linea{display:flex;flex-direction:row-reverse;gap:6px;justify-content:center;flex-wrap:wrap;padding:6px 0;}
  .campo-jugador{background:rgba(255,255,255,.92);border:1px solid var(--azul);border-radius:6px;padding:3px 6px;font-size:12px;text-align:center;min-width:56px;}
  .campo-jugador .cod{font-weight:600;}
  .campo-jugador .nom{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:78px;margin:0 auto;}
  .gol-rapido{background:none;border:none;color:var(--verde);cursor:pointer;font-weight:bold;font-size:12px;padding:0 2px;}
  .resultado-total{font-size:20px;font-weight:700;margin:4px 0;}

  .libro-tipos{display:flex;flex-wrap:wrap;gap:8px 18px;}
  .libro-opcion{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--texto);margin:0;cursor:pointer;}
  .libro-opcion input{width:auto;}
  .libro-paginas{display:flex;flex-direction:column;align-items:center;gap:16px;}
  .libro-pagina{width:100%;max-width:640px;height:auto;background:#fff;border:1px solid var(--borde);box-shadow:0 2px 8px rgba(0,0,0,.15);}

  @media (max-width: 600px){
    header{flex-direction:column;align-items:stretch;padding:10px 12px;}
    header h1{text-align:center;margin-bottom:4px;}
    nav{justify-content:center;}
    nav button{flex:1;min-width:0;padding:8px 6px;font-size:13px;}
    main{padding:10px;}
    .card{padding:12px;}
    .fila{flex-direction:column;}
    .fila > div{min-width:0;}
    table{font-size:13px;}
    th,td{padding:5px 4px;}
  }
</style>
</head>
<body>

<div id="auth-gate" class="card" style="max-width:360px;margin:60px auto;">
  <h2>Alevín D · acceso</h2>
  <div id="auth-msg"></div>
  <div id="auth-form">
    <label>Email</label>
    <input id="auth-email" type="email" placeholder="tu@email.com" value="andres.alarcon@gmail.com">
    <label style="margin-top:8px;">Contraseña</label>
    <input id="auth-password" type="password" placeholder="••••••••">
    <div style="height:10px;"></div>
    <button class="btn" onclick="entrar(this)">Entrar</button>
    <button class="btn sec" onclick="crearCuenta(this)">Crear cuenta (solo la primera vez)</button>
    <p class="muted">La sesión se mantiene guardada en este dispositivo — no hace falta volver a entrar cada partido.</p>
  </div>
</div>

<div id="app" class="oculto">
  <header>
    <h1>⚽ Alevín D</h1>
    <nav>
      <button id="nav-jugadores" onclick="irA('jugadores')">Jugadores</button>
      <button id="nav-partidos" onclick="irA('partidos')">Partidos</button>
      <button id="nav-libro" onclick="irA('libro')">Libro (PDF)</button>
      <button id="nav-estadisticas" onclick="irA('estadisticas')">Estadísticas</button>
      <button id="nav-actual" onclick="irAPartidoActual()" class="oculto">⚡ Partido actual</button>
      <button id="nav-admin" onclick="irA('admin')">Admin</button>
      <button onclick="cerrarSesion()" style="margin-left:8px;">Salir</button>
    </nav>
  </header>
  <main id="main"></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
/* ============================================================
   CONFIG
   ============================================================ */
const SUPABASE_URL = 'https://fxgjzfpasyxwiegmiwzb.supabase.co';
const SUPABASE_KEY = 'sb_publishable_xR-MTLBo-EU6l7h54jyPYQ_LqmdN71A';
const EMAIL_AUTORIZADO = 'andres.alarcon@gmail.com';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ============================================================
   TABLA DE CÓDIGOS DE POSICIÓN
   Convención: el equipo ataca hacia abajo del papel; dentro de
   cada línea, el primer jugador introducido es siempre el más a
   la derecha, el último el más a la izquierda.
   ============================================================ */
const TABLA_POSICIONES = {
  portero:      { 1: ['GK'] },
  defensa:      { 1: ['DCC'], 2: ['DCD','DCI'], 3: ['LD','DCC','LI'], 4: ['LD','DCD','DCI','LI'] },
  medio:        { 1: ['MC'],  2: ['MCD','MCI'],  3: ['MCD','MC','MCI'], 4: ['MD','MCD','MCI','MI'] },
  media_punta:  { 1: ['MP'] },
  delantero:    { 1: ['DC'],  2: ['DD','DI'],     3: ['ED','DC','EI'] },
};
const NOMBRE_LINEA = { portero:'Portero', defensa:'Defensa', medio:'Medio', media_punta:'Media punta', delantero:'Delantero' };

// Dado el tipo de línea y el nº de jugadores, devuelve los códigos en
// orden (derecha → izquierda). Si no hay una entrada exacta en la
// tabla, devuelve null y el llamante debe pedir los códigos a mano.
function calcularCodigos(linea, n){
  const tabla = TABLA_POSICIONES[linea];
  if (tabla && tabla[n]) return tabla[n].slice();
  return null;
}

/* ============================================================
   ESTADO
   ============================================================ */
let SESSION = null;
let JUGADORES = [];
let TIPOS_PARTIDO = [];
let TIPOS_JUGADOR = [];
let MOTIVOS_NO_CONVOCATORIA = []; // catálogo editable (Decisión técnica, Enfermedad, Viaje, …)
let PARTIDOS = [];
let VISTA = 'jugadores';
let PARTIDO_ACTUAL = null; // id del partido abierto en detalle
let RESUMEN_CUARTOS_POR_PARTIDO = {}; // { [partido_id]: {ge, gr, tiene} } — para el listado de partidos

/* ============================================================
   SPINNER genérico para botones de guardar/crear/eliminar
   ============================================================ */
async function conSpinner(boton, textoCargando, fn){
  if(!boton){ return await fn(); }
  const original = boton.innerHTML;
  boton.disabled = true;
  boton.innerHTML = `<span class="spinner"></span>${textoCargando}`;
  try {
    return await fn();
  } finally {
    boton.disabled = false;
    boton.innerHTML = original;
  }
}

/* ============================================================
   PERSISTENCIA DE NAVEGACIÓN — recordar la última pantalla y el
   último partido abierto, para no volver siempre a "Jugadores"
   tras recargar, y para el acceso directo "Partido actual".
   ============================================================ */
/* ============================================================
   MARCADOR — siempre se muestra primero el equipo que juega en casa
   ============================================================ */
const NOMBRE_EQUIPO = 'Alevín D';
// nuestros = goles de Alevín D, suyos = goles del rival. Si jugamos fuera,
// el rival es el local y va primero.
function textoMarcador(p, nuestros, suyos, conNombres){
  const fuera = p?.condicion === 'fuera';
  const a = nuestros ?? '?', b = suyos ?? '?';
  if(conNombres){
    const rival = p?.rival ?? 'Rival';
    return fuera ? `${rival} ${b} - ${a} ${NOMBRE_EQUIPO}` : `${NOMBRE_EQUIPO} ${a} - ${b} ${rival}`;
  }
  return fuera ? `${b} - ${a}` : `${a} - ${b}`;
}
// Devuelve [htmlLocal, htmlVisitante] a partir del html de "nuestro" campo y el del rival.
function ordenCasa(p, htmlNuestro, htmlRival){
  return p?.condicion === 'fuera' ? [htmlRival, htmlNuestro] : [htmlNuestro, htmlRival];
}

function guardarVista(vista){ try{ localStorage.setItem('alevin_d_vista', vista); }catch(e){} }
function leerVistaGuardada(){ try{ return localStorage.getItem('alevin_d_vista'); }catch(e){ return null; } }
function guardarPartidoActualId(id){ try{ localStorage.setItem('alevin_d_partido_actual_id', id); }catch(e){} }
function leerPartidoActualId(){ try{ return localStorage.getItem('alevin_d_partido_actual_id'); }catch(e){ return null; } }
function actualizarBotonPartidoActual(){
  const btn = document.getElementById('nav-actual');
  if(!btn) return;
  const id = leerPartidoActualId();
  const existe = !!(id && PARTIDOS.some(p => p.id === id));
  btn.classList.toggle('oculto', !existe);
  btn.classList.toggle('activo', existe && PARTIDO_ACTUAL === id);
}
function irAPartidoActual(){
  const id = leerPartidoActualId();
  if(id) abrirPartido(id);
}

/* ============================================================
   AUTENTICACIÓN
   ============================================================ */
async function entrar(boton){
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  const msg = document.getElementById('auth-msg');
  if(!email || !password){ msg.innerHTML = '<div class="aviso">Introduce email y contraseña.</div>'; return; }
  await conSpinner(boton, 'Entrando…', async () => {
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if(error){ msg.innerHTML = `<div class="aviso">${error.message}</div>`; return; }
    msg.innerHTML = '';
  });
}
async function crearCuenta(boton){
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  const msg = document.getElementById('auth-msg');
  if(!email || !password){ msg.innerHTML = '<div class="aviso">Introduce email y contraseña.</div>'; return; }
  if(password.length < 6){ msg.innerHTML = '<div class="aviso">La contraseña debe tener al menos 6 caracteres.</div>'; return; }
  await conSpinner(boton, 'Creando…', async () => {
    const { data, error } = await sb.auth.signUp({ email, password });
    if(error){ msg.innerHTML = `<div class="aviso">${error.message}</div>`; return; }
    if(data.session){
      msg.innerHTML = '<div class="ok">Cuenta creada y sesión iniciada.</div>';
    } else {
      msg.innerHTML = '<div class="aviso">Cuenta creada, pero Supabase pide confirmar el email antes de poder entrar. Si no quieres depender del correo, desactiva "Confirm email" en Authentication → Providers → Email del dashboard de Supabase, y vuelve a intentarlo.</div>';
    }
  });
}
async function cerrarSesion(){ await sb.auth.signOut(); location.reload(); }
async function cambiarContrasena(){
  const actual = prompt('Introduce tu contraseña actual (para confirmar que eres tú):');
  if(!actual) return;
  const { error: errActual } = await sb.auth.signInWithPassword({ email: EMAIL_AUTORIZADO, password: actual });
  if(errActual){ alert('La contraseña actual no es correcta.'); return; }
  const nueva = prompt('Nueva contraseña (mínimo 6 caracteres):');
  if(!nueva) return;
  if(nueva.length < 6){ alert('Debe tener al menos 6 caracteres.'); return; }
  const { error } = await sb.auth.updateUser({ password: nueva });
  if(error) return alert(error.message);
  alert('Contraseña actualizada.');
}

async function initAuth(){
  const { data:{ session } } = await sb.auth.getSession();
  SESSION = session;
  sb.auth.onAuthStateChange((_evt, s) => { SESSION = s; pintarAuth(); });
  pintarAuth();
}
function pintarAuth(){
  const emailSesion = (SESSION && SESSION.user && SESSION.user.email || '').trim().toLowerCase();
  const logueado = emailSesion && emailSesion === EMAIL_AUTORIZADO.toLowerCase();
  document.getElementById('auth-gate').classList.toggle('oculto', !!logueado);
  document.getElementById('app').classList.toggle('oculto', !logueado);
  if (logueado) cargarTodo();
  else if (emailSesion && emailSesion !== EMAIL_AUTORIZADO.toLowerCase()){
    document.getElementById('auth-msg').innerHTML =
      `<div class="aviso">El email con el que has entrado (${emailSesion}) no coincide con el autorizado (${EMAIL_AUTORIZADO}).</div>`;
  }
}

/* ============================================================
   CARGA DE DATOS
   ============================================================ */
async function cargarTodo(){
  await Promise.all([cargarTiposJugador(), cargarTiposPartido(), cargarMotivosNoConvocatoria()]);
  await cargarJugadores();
  await cargarPartidos();
  actualizarBotonPartidoActual();
  const vistaGuardada = leerVistaGuardada();
  const partidoGuardado = leerPartidoActualId();
  if(vistaGuardada === 'partido-detalle' && partidoGuardado && PARTIDOS.some(p => p.id === partidoGuardado)){
    await abrirPartido(partidoGuardado);
  } else if(vistaGuardada && ['jugadores','partidos','libro','admin','estadisticas'].includes(vistaGuardada)){
    irA(vistaGuardada);
  } else {
    irA(VISTA);
  }
}
async function cargarJugadores(){
  const { data, error } = await sb.from('alevin_d_jugadores').select('*').order('activo',{ascending:false}).order('dorsal');
  if(!error) JUGADORES = data;
}
async function cargarTiposPartido(){
  const { data, error } = await sb.from('alevin_d_tipos_partido').select('*').order('id');
  if(!error) TIPOS_PARTIDO = data;
}
async function cargarMotivosNoConvocatoria(){
  const { data, error } = await sb.from('alevin_d_motivos_no_convocatoria').select('*').order('id');
  if(!error) MOTIVOS_NO_CONVOCATORIA = data;
}
async function cargarTiposJugador(){
  const { data, error } = await sb.from('alevin_d_tipos_jugador').select('*').order('id');
  if(!error) TIPOS_JUGADOR = data;
}
function nombreTipoJugador(j){
  return TIPOS_JUGADOR.find(t => t.id === j.tipo_jugador_id)?.nombre ?? '?';
}
function idTipoJugadorFijo(){
  return TIPOS_JUGADOR.find(t => t.nombre === 'Fijo')?.id;
}
function idTipoJugadorTemporal(){
  return TIPOS_JUGADOR.find(t => t.nombre === 'Temporal')?.id;
}
async function cargarPartidos(){
  const { data, error } = await sb.from('alevin_d_partidos').select('*, alevin_d_tipos_partido(nombre)').order('fecha',{ascending:false});
  if(!error) PARTIDOS = data;
  const { data: cuartosResumen } = await sb.from('alevin_d_cuartos').select('partido_id, goles_equipo, goles_rival');
  RESUMEN_CUARTOS_POR_PARTIDO = {};
  (cuartosResumen || []).forEach(c => {
    if(!RESUMEN_CUARTOS_POR_PARTIDO[c.partido_id]) RESUMEN_CUARTOS_POR_PARTIDO[c.partido_id] = { ge:0, gr:0, tiene:false };
    const r = RESUMEN_CUARTOS_POR_PARTIDO[c.partido_id];
    if(c.goles_equipo != null){ r.ge += c.goles_equipo; r.tiene = true; }
    if(c.goles_rival != null){ r.gr += c.goles_rival; r.tiene = true; }
  });
  actualizarBotonPartidoActual();
}

/* ============================================================
   NAVEGACIÓN
   ============================================================ */
function irA(vista){
  VISTA = vista;
  PARTIDO_ACTUAL = null;
  guardarVista(vista);
  ['jugadores','partidos','libro','estadisticas','admin'].forEach(v => {
    document.getElementById('nav-'+v).classList.toggle('activo', v === vista);
  });
  if(vista === 'jugadores') renderJugadores();
  if(vista === 'partidos') renderPartidos();
  if(vista === 'libro') renderLibro();
  if(vista === 'estadisticas') renderEstadisticas();
  if(vista === 'admin') renderAdmin();
  actualizarBotonPartidoActual();
}

/* ============================================================
   JUGADORES
   ============================================================ */
let JUGADOR_EN_EDICION = null; // id del jugador con el panel de edición abierto
let VER_BAJAS = false;

function nombreConAlias(j){
  return j.alias ? `${j.nombre} <span class="muted">(${j.alias})</span>` : j.nombre;
}
function opcionesTiposJugador(seleccionadoId){
  return TIPOS_JUGADOR.map(t => `<option value="${t.id}" ${t.id===seleccionadoId?'selected':''}>${t.nombre}</option>`).join('');
}
function renderJugadores(){
  const main = document.getElementById('main');
  const lista = JUGADORES.filter(j => VER_BAJAS ? !j.activo : j.activo);
  const filas = lista.map(j => {
    const editando = JUGADOR_EN_EDICION === j.id;
    const tipoNombre = nombreTipoJugador(j);
    if(editando){
      return `
        <tr>
          <td colspan="3">
            <div class="fila">
              <div><label>Nombre</label><input id="ej-nombre-${j.id}" value="${j.nombre}"></div>
              <div><label>Alias / apodo</label><input id="ej-alias-${j.id}" value="${j.alias ?? ''}" placeholder="p.ej. Xavi"></div>
              <div><label>Dorsal</label><input id="ej-dorsal-${j.id}" type="number" value="${j.dorsal ?? ''}"></div>
              <div><label>Tipo</label>
                <select id="ej-tipo-${j.id}">${opcionesTiposJugador(j.tipo_jugador_id)}</select>
              </div>
            </div>
            <button class="btn" onclick="guardarEdicionJugador('${j.id}')">Guardar</button>
            <button class="btn sec" onclick="JUGADOR_EN_EDICION=null; renderJugadores();">Cancelar</button>
            <button class="btn danger" onclick="toggleActivoJugador('${j.id}', ${!j.activo})">${j.activo ? 'Dar de baja' : 'Reactivar'}</button>
          </td>
        </tr>`;
    }
    return `
      <tr>
        <td>${j.dorsal ?? '-'}</td>
        <td>${nombreConAlias(j)} ${tipoNombre !== 'Fijo' ? `<span class="badge">${tipoNombre}</span>` : ''}</td>
        <td><button class="btn sec" onclick="JUGADOR_EN_EDICION='${j.id}'; renderJugadores();">Editar</button></td>
      </tr>`;
  }).join('');
  main.innerHTML = `
    <div class="card">
      <h2>Añadir jugador</h2>
      <div class="fila">
        <div><label>Nombre</label><input id="nj-nombre"></div>
        <div><label>Dorsal</label><input id="nj-dorsal" type="number"></div>
        <div><label>Tipo</label>
          <select id="nj-tipo">${opcionesTiposJugador(idTipoJugadorFijo())}</select>
        </div>
      </div>
      <button class="btn" onclick="crearJugador()">Añadir</button>
    </div>
    <div class="card">
      <h2>Plantilla ${VER_BAJAS ? '— dados de baja' : ''}</h2>
      <div class="tabla-wrap"><table>
        <thead><tr><th>Dorsal</th><th>Nombre</th><th></th></tr></thead>
        <tbody>${filas || '<tr><td colspan="3" class="muted">Sin jugadores.</td></tr>'}</tbody>
      </table></div>
      <button class="btn sec" style="margin-top:8px;" onclick="VER_BAJAS=!VER_BAJAS; renderJugadores();">${VER_BAJAS ? '← Ver plantilla activa' : 'Ver dados de baja'}</button>
    </div>`;
}
async function crearJugador(){
  const nombre = document.getElementById('nj-nombre').value.trim();
  const dorsalRaw = document.getElementById('nj-dorsal').value;
  const tipo_jugador_id = parseInt(document.getElementById('nj-tipo').value);
  if(!nombre) return alert('Falta el nombre');

async function crearPartido(boton){
  const rival = document.getElementById('np-rival').value.trim();
  const fecha = document.getElementById('np-fecha').value;
  const hora = document.getElementById('np-hora').value || null;
  const condicion = document.getElementById('np-condicion').value;
  const tipo_partido_id = parseInt(document.getElementById('np-tipo').value);
  if(!rival || !fecha) return alert('Rival y fecha son obligatorios');
  await conSpinner(boton, 'Creando…', async () => {
    const { data, error } = await sb.from('alevin_d_partidos')
      .insert({ rival, fecha, hora, condicion, tipo_partido_id }).select().single();
    if(error) return alert(error.message);
    guardarUltimoTipoPartido(tipo_partido_id);
    // Convocatoria por defecto: solo los jugadores fijos activos (los temporales
    // se añaden y marcan a mano en cada partido). Se desmarcan los que falten.
    const idFijo = idTipoJugadorFijo();
    const activosFijos = JUGADORES.filter(j => j.activo && j.tipo_jugador_id === idFijo);
    if(activosFijos.length){

        .insert(activosFijos.map(j => ({ partido_id: data.id, jugador_id: j.id })));

    }
    await cargarPartidos();
    await abrirPartido(data.id);
  });
}

let DETALLE = null; // { partido, convocatoria:[{jugador_id,dorsal_partido,jugador}], cuartos:{1:{...},2:...} }
// Convocatoria: abierta mientras el partido no ha empezado a registrarse;
// en cuanto hay algún cuarto guardado se muestra plegada. Si el usuario la
// abre/cierra a mano se respeta, hasta que cambie el estado del partido.
let CONVOCATORIA_MANUAL = null; // { iniciado, abierta }
function partidoIniciado(){
  return !!DETALLE && [1,2,3,4].some(n => DETALLE.cuartos[n] && DETALLE.cuartos[n].row);
}
function convocatoriaAbierta(){
  const iniciado = partidoIniciado();
  if(CONVOCATORIA_MANUAL && CONVOCATORIA_MANUAL.iniciado === iniciado) return CONVOCATORIA_MANUAL.abierta;
  return !iniciado;
}

  renderPartidoDetalle();

async function cargarDetallePartido(id){
  // Todo en paralelo (antes se pedía 1 fila por cuarto en serie: hasta 9
  // idas y vueltas seguidas — esto era la causa de la lentitud al abrir un partido).
  const partidoLocal = PARTIDOS.find(p => p.id === id);
  const [partidoRes, convRes, cuartosRes, noConvRes] = await Promise.all([
    partidoLocal ? Promise.resolve({ data: partidoLocal }) : sb.from('alevin_d_partidos').select('*, alevin_d_tipos_partido(nombre)').eq('id', id).single(),
    sb.from('alevin_d_convocatoria').select('*, alevin_d_jugadores(*)').eq('partido_id', id),
    sb.from('alevin_d_cuartos').select('*').eq('partido_id', id).order('numero'),
    sb.from('alevin_d_no_convocados').select('jugador_id, motivo_id').eq('partido_id', id)
  ]);
  const partido = partidoRes.data;
  const conv = convRes.data;
  const cuartosRows = cuartosRes.data || [];
  const idsCuartos = cuartosRows.map(c => c.id);

  let alineacionesTodas = [], golesTodos = [];
  if(idsCuartos.length){
    const [alRes, glRes] = await Promise.all([
      sb.from('alevin_d_alineacion_cuarto').select('*, alevin_d_jugadores(nombre)').in('cuarto_id', idsCuartos),
      sb.from('alevin_d_goles').select('*, autor:alevin_d_jugadores!alevin_d_goles_jugador_id_fkey(nombre), asistente:alevin_d_jugadores!alevin_d_goles_asistente_id_fkey(nombre)').in('cuarto_id', idsCuartos)
    ]);
    alineacionesTodas = alRes.data || [];
    golesTodos = glRes.data || [];
  }

  const cuartos = {};
  for (let n=1; n<=4; n++){
    const row = cuartosRows.find(c => c.numero === n);
    cuartos[n] = {
      row,
      alineacion: row ? alineacionesTodas.filter(a => a.cuarto_id === row.id) : [],
      goles: row ? golesTodos.filter(g => g.cuarto_id === row.id) : []
    };
  }
  let fotoUrl = null;
  if(partido && partido.foto_convocatoria_path){
    const { data: firmada } = await sb.storage.from('alevin-d-fotos').createSignedUrl(partido.foto_convocatoria_path, 3600);
    fotoUrl = firmada?.signedUrl || null;
  }
  const noConvocados = {}; // jugador_id -> motivo_id
  (noConvRes.data || []).forEach(r => { noConvocados[r.jugador_id] = r.motivo_id; });
  DETALLE = { partido, convocatoria: conv || [], cuartos, fotoUrl, noConvocados };
}
function jugadorPorId(id){ return JUGADORES.find(j => j.id === id); }

function totalCuartos(){
  let ge = 0, gr = 0, tiene = false;
  for(let n=1; n<=4; n++){
    const row = DETALLE.cuartos[n].row;
    if(row){
      if(row.goles_equipo != null){ ge += row.goles_equipo; tiene = true; }
      if(row.goles_rival != null){ gr += row.goles_rival; tiene = true; }
    }
  }
  return tiene ? { ge, gr } : null;
}

          `<div><label>Goles ${p.rival} (resultado oficial)</label><input id="pd-gc" type="number" value="${p.goles_contra ?? ''}"></div>`

        <div style="align-self:flex-end;"><button class="btn sec" onclick="guardarResultadoFinal(this)">Guardar resultado</button></div>

// Lista de goles del partido (todos los cuartos), bajo el resultado.
function renderGoleadoresPartido(){
  const goles = [];
  for(let n=1; n<=4; n++){
    (DETALLE.cuartos[n].goles || []).slice()
      .sort((a,b) => (a.created_at||'').localeCompare(b.created_at||''))
      .forEach(g => goles.push({ ...g, cuarto: n }));
  }
  if(!goles.length) return '';
  const items = goles.map(g => `
    <li>⚽ <strong>${g.autor?.nombre ?? '?'}</strong>${g.asistente ? ` <span class="muted">· asist. ${g.asistente.nombre}</span>` : ''} <span class="muted" style="font-size:12px;">(C${g.cuarto})</span></li>`).join('');
  return `<ul style="list-style:none;padding:0;margin:4px 0 10px;font-size:14px;line-height:1.6;">${items}</ul>`;
}

// Resumen al final de la ficha: cuántos cuartos ha jugado cada convocado,
// agrupado por nº de cuartos (4, 3, 2, 1, 0) para verlo de un vistazo.
function renderResumenCuartosJugados(){
  const conteo = {};   // jugador_id -> nº de cuartos
  const porteria = {}; // jugador_id -> nº de cuartos de portero
  let hayAlineaciones = false;
  for(let n=1; n<=4; n++){
    const al = DETALLE.cuartos[n].alineacion || [];
    if(al.length) hayAlineaciones = true;
    new Set(al.map(a => a.jugador_id)).forEach(jid => { conteo[jid] = (conteo[jid] || 0) + 1; });
    al.filter(a => a.linea === 'portero').forEach(a => { porteria[a.jugador_id] = (porteria[a.jugador_id] || 0) + 1; });
  }
  if(!hayAlineaciones) return '';
  // convocados + cualquiera que haya jugado (por si se desconvocó después)
  const ids = new Set([...DETALLE.convocatoria.map(c => c.jugador_id), ...Object.keys(conteo)]);
  const grupos = { 4:[], 3:[], 2:[], 1:[], 0:[] };
  ids.forEach(jid => {
    const j = jugadorPorId(jid) || DETALLE.convocatoria.find(c => c.jugador_id === jid)?.alevin_d_jugadores;
    const k = Math.min(conteo[jid] || 0, 4);
    grupos[k].push({ nombre: j?.nombre ?? '?', dorsal: j?.dorsal, gk: porteria[jid] || 0 });
  });
  const colores = { 4:'#15803d', 3:'#65a30d', 2:'#ca8a04', 1:'#ea580c', 0:'#9ca3af' };
  const filas = [4,3,2,1,0].filter(k => grupos[k].length).map(k => {
    const chips = grupos[k].sort((a,b) => (a.dorsal ?? 99) - (b.dorsal ?? 99)).map(j =>
      `<span class="chip" style="border-color:${colores[k]};">${j.dorsal ?? '-'} · ${j.nombre}${j.gk ? ` <span class="muted" style="font-size:11px;margin-left:4px;">🧤${j.gk}</span>` : ''}</span>`).join('');
    return `
      <div style="display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--borde);">
        <div style="flex:0 0 auto;width:44px;height:44px;border-radius:50%;background:${colores[k]};color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;">
          <span style="font-size:18px;font-weight:700;">${k}</span><span style="font-size:9px;">${k===1?'cuarto':'cuartos'}</span>
        </div>
        <div class="chips" style="flex:1;">${chips}</div>
      </div>`;
  }).join('');
  return `
    <div class="card">
      <h3 style="margin-top:0;">📊 Resumen: cuartos jugados</h3>
      ${filas}
      <p class="muted" style="font-size:12px;margin-bottom:0;">🧤 = cuartos jugados de portero. Se cuenta a partir de las alineaciones guardadas.</p>
    </div>`;
}

async function guardarDatosPartido(boton){
  const rival = document.getElementById('ep-rival').value.trim();
  const fecha = document.getElementById('ep-fecha').value;
  const hora = document.getElementById('ep-hora').value || null;
  const condicion = document.getElementById('ep-condicion').value;
  const tipo_partido_id = parseInt(document.getElementById('ep-tipo').value);
  if(!rival || !fecha) return alert('Rival y fecha son obligatorios');

      .update({ rival, fecha, hora, condicion, tipo_partido_id }).eq('id', PARTIDO_ACTUAL);

async function eliminarPartido(boton){

  await conSpinner(boton, 'Eliminando…', async () => {

/* ============================================================
   CUARTOS — líneas, cálculo de posiciones, goles/asistencias
   ============================================================ */
// Estado temporal de edición de líneas por cuarto (no persistido hasta "Guardar")
const EDICION_CUARTO = {}; // { [numero]: { portero:[jugador_id], defensa:[...], medio:[...], media_punta:[...], delantero:[...] } }

// Posiciones disponibles en el modo "por jugador". "x" = posición lateral,
// 0 = más a la derecha … 4 = más a la izquierda (convención del proyecto:
// dentro de cada línea el orden es siempre de derecha a izquierda).
const POSICIONES = [
  { cod:'GK',  linea:'portero',     x:2, nombre:'Portero' },
  { cod:'LD',  linea:'defensa',     x:0, nombre:'Lateral derecho' },
  { cod:'DCD', linea:'defensa',     x:1, nombre:'Central derecho' },
  { cod:'DCC', linea:'defensa',     x:2, nombre:'Central' },
  { cod:'DCI', linea:'defensa',     x:3, nombre:'Central izquierdo' },
  { cod:'LI',  linea:'defensa',     x:4, nombre:'Lateral izquierdo' },
  { cod:'MD',  linea:'medio',       x:0, nombre:'Medio derecho' },
  { cod:'MCD', linea:'medio',       x:1, nombre:'Medio centro derecho' },
  { cod:'MC',  linea:'medio',       x:2, nombre:'Medio centro' },
  { cod:'MCI', linea:'medio',       x:3, nombre:'Medio centro izquierdo' },
  { cod:'MI',  linea:'medio',       x:4, nombre:'Medio izquierdo' },
  { cod:'MP',  linea:'media_punta', x:2, nombre:'Media punta' },
  { cod:'ED',  linea:'delantero',   x:0, nombre:'Extremo derecho' },
  { cod:'DD',  linea:'delantero',   x:1, nombre:'Delantero derecho' },
  { cod:'DC',  linea:'delantero',   x:2, nombre:'Delantero centro' },
  { cod:'DI',  linea:'delantero',   x:3, nombre:'Delantero izquierdo' },
  { cod:'EI',  linea:'delantero',   x:4, nombre:'Extremo izquierdo' },
];
function posicionPorCodigo(cod){ return POSICIONES.find(p => p.cod === cod); }

// Modo de edición de la alineación: 'jugador' (elegir posición a cada jugador)
// o 'lineas' (añadir jugadores a cada línea en orden). Se recuerda el último usado.
function leerModoAlineacion(){ try{ return localStorage.getItem('alevin_d_modo_alineacion') || 'jugador'; }catch(e){ return 'jugador'; } }
function guardarModoAlineacion(m){ try{ localStorage.setItem('alevin_d_modo_alineacion', m); }catch(e){} }
let MODO_ALINEACION = leerModoAlineacion();

// Código efectivo de cada jugador en la edición actual: el corregido a mano
// si lo hay, o el calculado por la tabla según su línea y orden.
function codigosEdicion(n){
  const ed = EDICION_CUARTO[n];
  const res = {}; // jugador_id -> { linea, idx, codigo }
  Object.keys(NOMBRE_LINEA).forEach(linea => {
    const calc = calcularCodigos(linea, ed[linea].length) || [];
    ed[linea].forEach((jid, idx) => {
      res[jid] = { linea, idx, codigo: (ed.codigos && ed.codigos[jid]) || calc[idx] || '' };
    });
  });
  return res;
}

// Modo por jugador: asignar (o quitar) la posición de un jugador. Se traduce
// a la misma estructura por líneas que usa el otro modo, ordenando cada línea
// de derecha a izquierda según la posición elegida — así ambos modos
// comparten estado y se puede cambiar de uno a otro sin perder nada.
function asignarPosicion(n, jugadorId, cod){
  const ed = EDICION_CUARTO[n];
  const actuales = codigosEdicion(n);
  // quitar al jugador de donde estuviera
  Object.keys(NOMBRE_LINEA).forEach(l => { ed[l] = ed[l].filter(j => j !== jugadorId); });
  if(ed.codigos) delete ed.codigos[jugadorId];
  if(cod){
    const pos = posicionPorCodigo(cod);
    if(pos.linea === 'portero'){
      // solo un portero: el anterior (si lo hay) pasa a "no juega"
      ed.portero.forEach(j => { if(ed.codigos) delete ed.codigos[j]; });
      ed.portero = [];
    }
    ed[pos.linea].push(jugadorId);
    ed.codigos = ed.codigos || {};
    ed.codigos[jugadorId] = cod;
    // reordenar la línea de derecha a izquierda según el código de cada jugador
    const xDe = j => posicionPorCodigo(ed.codigos[j] || (actuales[j] && actuales[j].codigo))?.x ?? 2;
    ed[pos.linea].forEach(j => { if(!ed.codigos[j] && actuales[j]) ed.codigos[j] = actuales[j].codigo; });
    ed[pos.linea].sort((a,b) => xDe(a) - xDe(b));
  }
  renderResumenPorJugador(n);
}

function cambiarModoAlineacion(n, modo){
  MODO_ALINEACION = modo;
  guardarModoAlineacion(modo);
  renderPartidoDetalle();
}

function textoResumenEdicion(n){
  const ed = EDICION_CUARTO[n];
  const cods = codigosEdicion(n);
  const orden = ['portero','defensa','medio','media_punta','delantero'];
  const partes = orden.filter(l => ed[l].length).map(l =>
    ed[l].map(j => `${cods[j].codigo || '?'} ${jugadorPorId(j)?.nombre ?? '?'}`).join(' · '));
  const total = orden.reduce((s,l) => s + ed[l].length, 0);
  return total ? `<strong>${total} jugador(es):</strong> ${partes.join(' &nbsp;|&nbsp; ')}` : '<span class="muted">Nadie asignado todavía.</span>';
}
function renderResumenPorJugador(n){
  const el = document.getElementById(`resumen-pj-${n}`);
  if(el) el.innerHTML = textoResumenEdicion(n);
  // marcar visualmente quién juega
  (DETALLE.convocatoria || []).forEach(c => {
    const fila = document.getElementById(`pj-${n}-${c.jugador_id}`);
    const cods = codigosEdicion(n);
    if(fila){
      fila.style.background = cods[c.jugador_id] ? '#eff6ff' : '#fff';
      const sel = fila.querySelector('select');
      if(sel && sel.value !== (cods[c.jugador_id]?.codigo || '')) sel.value = cods[c.jugador_id]?.codigo || '';
    }
  });
}

function renderEditorPorJugador(n){
  const convocados = jugadoresConvocados();
  const cods = codigosEdicion(n);
  const grupos = ['portero','defensa','medio','media_punta','delantero'].map(l =>
    `<optgroup label="${NOMBRE_LINEA[l]}">${POSICIONES.filter(p => p.linea === l).map(p => `<option value="${p.cod}">${p.cod} — ${p.nombre}</option>`).join('')}</optgroup>`
  ).join('');
  const filas = convocados.map(j => {
    const actual = cods[j.id]?.codigo || '';
    const opciones = `<option value="">— no juega —</option>${grupos}`.replace(`value="${actual}"`, `value="${actual}" selected`);
    return `
      <div id="pj-${n}-${j.id}" style="display:flex;align-items:center;gap:8px;padding:5px 8px;border:1px solid var(--borde);border-radius:6px;background:${cods[j.id]?'#eff6ff':'#fff'};">
        <span style="flex:1;min-width:0;">${j.dorsal ?? '-'} · ${j.nombre}</span>
        <select style="width:auto;max-width:60%;" onchange="asignarPosicion(${n}, '${j.id}', this.value)">${opciones}</select>
      </div>`;
  }).join('');
  return `
    <p class="muted" style="margin-top:0;">Elige la posición de cada jugador que juega este cuarto. Portero vacío = se mantiene el del cuarto anterior.</p>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:6px;">${filas || '<p class="muted">No hay convocados.</p>'}</div>
    <p id="resumen-pj-${n}" style="font-size:13px;margin:10px 0;">${textoResumenEdicion(n)}</p>`;
}

function jugadoresConvocados(){
  return DETALLE.convocatoria.map(c => c.alevin_d_jugadores).filter(Boolean);
}
function iniciarEdicionCuarto(n){
  if(EDICION_CUARTO[n]) return;
  const c = DETALLE.cuartos[n];
  const porLinea = { portero:[], defensa:[], medio:[], media_punta:[], delantero:[] };
  porLinea.codigos = {};
  (c.alineacion||[]).slice().sort((a,b)=>a.orden_en_linea-b.orden_en_linea).forEach(a => {
    porLinea[a.linea].push(a.jugador_id);
    if(a.posicion_codigo && a.posicion_codigo !== '?') porLinea.codigos[a.jugador_id] = a.posicion_codigo;
  });
  // Si los códigos guardados coinciden con los que da la tabla, no los tratamos
  // como "manuales" (así al añadir/quitar jugadores se recalculan solos).
  Object.keys(NOMBRE_LINEA).forEach(linea => {
    const calc = calcularCodigos(linea, porLinea[linea].length) || [];
    porLinea[linea].forEach((jid, idx) => { if(porLinea.codigos[jid] === calc[idx]) delete porLinea.codigos[jid]; });
  });
  EDICION_CUARTO[n] = porLinea;
}
let CUARTOS_ABIERTOS = new Set();
// Cuartos cuya alineación ya guardada se está reeditando (si no está aquí y
// ya tiene alineación guardada, se muestra la vista de campo en vez del editor).
let EDITANDO_CUARTO = new Set();

function renderCuarto(n){
  const c = DETALLE.cuartos[n];
  const tieneAlineacion = (c.alineacion || []).length > 0;
  const editando = EDITANDO_CUARTO.has(n) || !tieneAlineacion;
  if(editando) iniciarEdicionCuarto(n);

  const resumen = c.row
    ? `${textoMarcador(DETALLE.partido, c.row.goles_equipo, c.row.goles_rival)} · ${c.goles.length} gol(es)`
    : 'sin datos guardados';

  const cuerpoAlineacion = editando ? renderEditorCuarto(n) : renderCampoCuarto(n);
  const golesHtml = renderGolesCuarto(n);

  return `
    <details class="card" style="padding:0;" ${CUARTOS_ABIERTOS.has(n) ? 'open' : ''} ontoggle="if(this.open) CUARTOS_ABIERTOS.add(${n}); else CUARTOS_ABIERTOS.delete(${n});">
      <summary style="cursor:pointer;padding:16px;font-weight:600;font-size:15px;">Cuarto ${n} <span class="muted" style="font-weight:normal;">— ${resumen}</span></summary>
      <div style="padding:0 16px 16px;">
        <div class="fila">
${ordenCasa(DETALLE.partido, `
          <div><label>Goles ${NOMBRE_EQUIPO}</label>
            <div style="display:flex;gap:6px;align-items:center;">
              <input id="cq-ge-${n}" type="number" value="${c.row?.goles_equipo ?? ''}" style="flex:1;">
              <button type="button" class="btn sec" onclick="incrementarMarcador(${n}, 'goles_equipo', 1)">+1</button>
              <button type="button" class="btn sec" onclick="incrementarMarcador(${n}, 'goles_equipo', -1)">-1</button>
            </div>
          </div>
`, `
          <div><label>Goles ${DETALLE.partido.rival}</label>
            <div style="display:flex;gap:6px;align-items:center;">
              <input id="cq-gr-${n}" type="number" value="${c.row?.goles_rival ?? ''}" style="flex:1;">
              <button type="button" class="btn sec" onclick="incrementarMarcador(${n}, 'goles_rival', 1)">+1</button>
              <button type="button" class="btn sec" onclick="incrementarMarcador(${n}, 'goles_rival', -1)">-1</button>
            </div>
          </div>
`).join('')}
        </div>
        <h4 style="margin-bottom:4px;">Alineación</h4>
        ${cuerpoAlineacion}
        ${golesHtml}
      </div>
    </details>`;
}

// Vista de campo: solo lectura, para cuando la alineación de ese cuarto ya
// está guardada — con botón de gol rápido junto a cada jugador.
function renderCampoCuarto(n){
  const c = DETALLE.cuartos[n];
  const porLinea = { portero:[], defensa:[], medio:[], media_punta:[], delantero:[] };
  (c.alineacion||[]).slice().sort((a,b)=>a.orden_en_linea-b.orden_en_linea).forEach(a => {
    porLinea[a.linea].push(a);
  });
  // Orden visual de arriba a abajo: delantero primero, portero al final (abajo),
  // para que se lea como un campo real con la portería propia en la parte de abajo.
  const ordenVisual = ['delantero','media_punta','medio','defensa','portero'];
  const filas = ordenVisual.map(linea => {
    const jugadoresLinea = porLinea[linea];
    if(!jugadoresLinea.length) return '';
    const pastillas = jugadoresLinea.map(a => `
      <div class="campo-jugador">
        <div class="cod">${a.posicion_codigo || '?'}</div>
        <div class="nom">${a.alevin_d_jugadores?.nombre ?? '?'}</div>
      </div>`).join('');
    return `<div class="campo-linea">${pastillas}</div>`;
  }).join('');
  return `
    <div class="campo">${filas || '<p class="muted" style="color:#fff;text-align:center;margin:0;">Sin alineación guardada.</p>'}</div>
    <button class="btn sec" onclick="EDITANDO_CUARTO.add(${n}); renderPartidoDetalle();">✏️ Editar alineación</button>`;
}

// Editor de alineación: selector de modo + el editor correspondiente + botones.
function renderEditorCuarto(n){
  const cuartoGuardado = !!DETALLE.cuartos[n].row;
  const btnModo = (m, txt) => `<button type="button" class="btn ${MODO_ALINEACION===m?'':'sec'}" style="font-size:13px;padding:4px 10px;" onclick="cambiarModoAlineacion(${n}, '${m}')">${txt}</button>`;
  return `
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;align-items:center;">
      <span class="muted" style="font-size:13px;">Modo:</span>
      ${btnModo('jugador', '👤 Por jugador')}
      ${btnModo('lineas', '↔️ Por líneas')}
    </div>
    ${MODO_ALINEACION === 'jugador' ? renderEditorPorJugador(n) : renderEditorLineasCuarto(n)}
    <button class="btn" onclick="guardarCuarto(${n}, this)">Guardar alineación del cuarto ${n}</button>
    ${cuartoGuardado ? `<button class="btn sec" onclick="EDITANDO_CUARTO.delete(${n}); delete EDICION_CUARTO[${n}]; renderPartidoDetalle();">Cancelar edición</button>` : ''}`;
}

// Editor de líneas (el formulario clásico de añadir/quitar jugadores por línea).
function renderEditorLineasCuarto(n){
  const c = DETALLE.cuartos[n];
  const edicion = EDICION_CUARTO[n];
  const convocados = jugadoresConvocados();
  const cuartoGuardado = !!c.row;

  const cods = codigosEdicion(n);
  const lineasHtml = Object.keys(NOMBRE_LINEA).map(linea => {
    const seleccion = edicion[linea];
    const chips = seleccion.map((jid, idx) => {
      const j = jugadorPorId(jid);
      const codigo = cods[jid]?.codigo || '';
      const golBtn = cuartoGuardado ? `<button type="button" class="gol-rapido" title="Registrar gol de este jugador" onclick="golRapido(${n}, '${jid}')">⚽</button>` : '';
      return `<span class="chip">${j ? j.nombre : '?'}
        <input type="text" value="${codigo}" data-linea="${linea}" data-idx="${idx}" onchange="codigoManual(${n}, this, '${jid}')" title="código de posición (editable)">
        ${golBtn}
        <button type="button" class="chip-x" onclick="quitarDeLinea(${n}, '${linea}', ${idx})">×</button>
      </span>`;
    }).join('');
    const avisoSinTabla = seleccion.length > 0 && !calcularCodigos(linea, seleccion.length)
      ? `<p class="muted">Sin regla automática para ${seleccion.length} jugador(es) en esta línea — edita los códigos a mano.</p>` : '';
    // Un jugador solo puede estar en una línea por cuarto (antes se podía
    // añadir el mismo jugador a dos líneas y el guardado fallaba).
    const opciones = convocados
      .filter(j => !cods[j.id])
      .map(j => `<option value="${j.id}">${j.nombre}</option>`).join('');
    const notaPortero = (linea === 'portero' && seleccion.length === 0)
      ? '<p class="muted">Vacío = se mantiene el mismo portero que en el cuarto anterior.</p>' : '';
    return `
      <div class="linea-box">
        <strong>${NOMBRE_LINEA[linea]}</strong>
        <div class="chips">${chips || '<span class="muted">— sin jugadores —</span>'}</div>
        ${avisoSinTabla}${notaPortero}
        <select onchange="anadirALinea(${n}, '${linea}', this.value); this.value='';">
          <option value="">+ añadir jugador…</option>
          ${opciones}
        </select>
      </div>`;
  }).join('');

  return lineasHtml;
}

function renderGolesCuarto(n){
  const c = DETALLE.cuartos[n];
  const convocados = jugadoresConvocados();
  const goles = c.goles.map(g => `
    <li>⚽ <strong>${g.autor?.nombre ?? '?'}</strong> ${g.asistente ? `<span class="muted">(asistencia: ${g.asistente.nombre})</span>` : ''}
      <button class="chip-x" onclick="borrarGol('${g.id}', ${n})">×</button>
    </li>`).join('');
  const opcionesGoleador = convocados.map(j => `<option value="${j.id}">${j.nombre}</option>`).join('');
  return `
    <div class="linea-box" style="margin-top:16px;border-style:solid;">
      <strong>⚽ Goles de este cuarto</strong>
      <ul style="margin:8px 0;padding-left:20px;">${goles || '<li class="muted">Sin goles registrados</li>'}</ul>
      <div class="fila">
        <div><label>Goleador</label><select id="gol-autor-${n}"><option value="">—</option>${opcionesGoleador}</select></div>
        <div><label>Asistente (opcional)</label><select id="gol-asist-${n}"><option value="">—</option>${opcionesGoleador}</select></div>
        <div style="align-self:flex-end;"><button class="btn sec" onclick="anadirGol(${n}, this)">+ Añadir gol</button></div>
      </div>
      ${!c.row ? '<p class="muted">Guarda primero la alineación de este cuarto para poder registrar goles.</p>' : ''}
    </div>`;
}

// Al añadir/quitar en una línea cambia el nº de jugadores, así que los códigos
// de esa línea se vuelven a calcular con la tabla (se descartan los manuales).
function limpiarCodigosLinea(n, linea){
  const ed = EDICION_CUARTO[n];
  if(ed.codigos) ed[linea].forEach(j => delete ed.codigos[j]);
}
function anadirALinea(n, linea, jugadorId){
  if(!jugadorId) return;
  limpiarCodigosLinea(n, linea);
  EDICION_CUARTO[n][linea].push(jugadorId);
  renderPartidoDetalle();
}
function quitarDeLinea(n, linea, idx){
  limpiarCodigosLinea(n, linea);
  const [quitado] = EDICION_CUARTO[n][linea].splice(idx, 1);
  if(EDICION_CUARTO[n].codigos) delete EDICION_CUARTO[n].codigos[quitado];
  renderPartidoDetalle();
}
function codigoManual(n, input, jugadorId){
  // Se guarda en el estado de edición para que no se pierda al re-pintar
  // ni al cambiar de modo.
  const ed = EDICION_CUARTO[n];
  ed.codigos = ed.codigos || {};
  const v = input.value.trim().toUpperCase();
  if(v) ed.codigos[jugadorId] = v; else delete ed.codigos[jugadorId];
}

// Botones +1 / -1 del marcador del cuarto. Si el cuarto ya existe en BD, se
// guarda al momento; si aún no se ha creado (primer guardado pendiente), solo
// actualiza el campo del formulario y quedará guardado al pulsar "Guardar".
async function incrementarMarcador(n, campoDb, delta){
  const inputId = campoDb === 'goles_equipo' ? `cq-ge-${n}` : `cq-gr-${n}`;
  const input = document.getElementById(inputId);
  if(!input) return;
  const actual = parseInt(input.value) || 0;
  const nuevo = Math.max(0, actual + delta);
  input.value = nuevo;
  const cuartoId = DETALLE.cuartos[n].row?.id;
  if(!cuartoId) return; // se guardará junto con la alineación
  const { error } = await sb.from('alevin_d_cuartos').update({ [campoDb]: nuevo }).eq('id', cuartoId);
  if(error) return alert(error.message);
  DETALLE.cuartos[n].row[campoDb] = nuevo;
  renderPartidoDetalle();
}

async function guardarCuarto(n, boton){
  await conSpinner(boton, 'Guardando…', async () => {
    const edicion = EDICION_CUARTO[n];
    const cods = codigosEdicion(n);

    // Portero: si no se ha puesto ninguno, heredar el del cuarto anterior —
    // salvo que ese jugador ya esté colocado en otra posición en este cuarto.
    let porteroId = edicion.portero[0];
    if(!porteroId){
      for(let prev = n-1; prev >= 1; prev--){
        const anterior = (DETALLE.cuartos[prev].alineacion||[]).find(a => a.linea === 'portero');
        if(anterior){ porteroId = anterior.jugador_id; break; }
      }
      if(porteroId && cods[porteroId]){
        const j = jugadorPorId(porteroId);
        alert(`No se hereda el portero del cuarto anterior (${j?.nombre ?? '?'}) porque ya está como ${cods[porteroId].codigo || NOMBRE_LINEA[cods[porteroId].linea]} en este cuarto. Elige un portero si lo hay.`);
        porteroId = null;
      }
    }

    // Construir todas las filas y VALIDAR antes de tocar nada en la base de datos
    // (antes se borraba la alineación vieja y luego fallaba el insert, dejando el
    // cuarto a medias).
    const filasBase = [];
    Object.keys(NOMBRE_LINEA).forEach(linea => {
      const jugadoresLinea = linea === 'portero' ? (porteroId ? [porteroId] : []) : edicion[linea];
      const calc = calcularCodigos(linea, jugadoresLinea.length);
      jugadoresLinea.forEach((jid, idx) => {
        const codigo = (edicion.codigos && edicion.codigos[jid]) || (calc ? calc[idx] : '') || '?';
        filasBase.push({ jugador_id: jid, linea, orden_en_linea: idx+1, posicion_codigo: codigo });
      });
    });
    const vistos = new Set();
    for(const f of filasBase){
      if(vistos.has(f.jugador_id)){
        return alert(`${jugadorPorId(f.jugador_id)?.nombre ?? 'Un jugador'} aparece dos veces en la alineación. Quítalo de una de las posiciones antes de guardar.`);
      }
      vistos.add(f.jugador_id);
    }

    const ge = document.getElementById(`cq-ge-${n}`).value;
    const gr = document.getElementById(`cq-gr-${n}`).value;

    try {
      // upsert por (partido, nº de cuarto): si el cuarto ya existe en la base de
      // datos aunque la pantalla no lo sepa (p.ej. tras un fallo anterior), se
      // actualiza en vez de dar error de clave duplicada.
      const { data: cuarto, error } = await sb.from('alevin_d_cuartos').upsert({
        partido_id: PARTIDO_ACTUAL, numero: n,
        goles_equipo: ge===''?null:parseInt(ge), goles_rival: gr===''?null:parseInt(gr)
      }, { onConflict: 'partido_id,numero' }).select().single();
      if(error) throw error;
      const cuartoId = cuarto.id;

      // Reconstruir alineación completa del cuarto
      const { data: previa } = await sb.from('alevin_d_alineacion_cuarto')
        .select('jugador_id, linea, orden_en_linea, posicion_codigo').eq('cuarto_id', cuartoId);
      const { error: eDel } = await sb.from('alevin_d_alineacion_cuarto').delete().eq('cuarto_id', cuartoId);
      if(eDel) throw eDel;
      if(filasBase.length){
        const { error: eIns } = await sb.from('alevin_d_alineacion_cuarto')
          .insert(filasBase.map(f => ({ ...f, cuarto_id: cuartoId })));
        if(eIns){
          // Restaurar la alineación que había para no dejar el cuarto vacío
          if(previa && previa.length){
            await sb.from('alevin_d_alineacion_cuarto').insert(previa.map(f => ({ ...f, cuarto_id: cuartoId })));
          }
          throw eIns;
        }
      }
    } catch(err){
      alert('No se pudo guardar el cuarto: ' + (err.message || err));
      // Resincronizar con la base de datos, conservando lo que se estaba editando
      await cargarDetallePartido(PARTIDO_ACTUAL);
      renderPartidoDetalle();
      return;
    }
    delete EDICION_CUARTO[n];
    EDITANDO_CUARTO.delete(n); // al guardar, pasa a mostrarse como campo (colapsa el editor)
    await cargarDetallePartido(PARTIDO_ACTUAL);
    renderPartidoDetalle();
  });
}

async function golRapido(n, jugadorId){
  const cuartoId = DETALLE.cuartos[n].row?.id;
  if(!cuartoId) return alert('Guarda antes la alineación del cuarto para poder registrar goles.');
  const { error } = await sb.from('alevin_d_goles').insert({ cuarto_id: cuartoId, jugador_id: jugadorId });
  if(error) return alert(error.message);
  await cargarDetallePartido(PARTIDO_ACTUAL);
  renderPartidoDetalle();
}
async function anadirGol(n, boton){
  const cuartoId = DETALLE.cuartos[n].row?.id;
  if(!cuartoId) return alert('Guarda antes la alineación del cuarto para poder registrar goles.');
  const autor = document.getElementById(`gol-autor-${n}`).value;
  const asistente = document.getElementById(`gol-asist-${n}`).value || null;
  if(!autor) return alert('Falta el goleador');
  await conSpinner(boton, 'Guardando…', async () => {
    const { error } = await sb.from('alevin_d_goles').insert({ cuarto_id: cuartoId, jugador_id: autor, asistente_id: asistente });
    if(error) return alert(error.message);
    await cargarDetallePartido(PARTIDO_ACTUAL);
    renderPartidoDetalle();
  });
}
async function borrarGol(id, n){
  const { error } = await sb.from('alevin_d_goles').delete().eq('id', id);
  if(error) return alert(error.message);
  await cargarDetallePartido(PARTIDO_ACTUAL);
  renderPartidoDetalle();
}

/* ============================================================
   LIBRO DE TEMPORADA — vista previa y PDF
   Una página por partido (cartel de convocatoria con los escudos,
   resultado, goleadores/asistentes y 4 campos con las alineaciones)
   y una portada por sección (tipo de partido + temporada).
   Las páginas se dibujan en canvas (A4 a 150 ppp): lo que se ve en
   la vista previa es exactamente lo que acaba en el PDF.
   ============================================================ */
const NOMBRE_COMPLETO_EQUIPO = 'Alevín D San Cayetano';
const FUENTE_TITULO = "'Bangers', 'Impact', 'Arial Black', sans-serif"; // tipografía de los rótulos
const PAG_W = 1240, PAG_H = 1754; // A4 a 150 ppp
const ORDEN_VISUAL_LINEAS = ['delantero','media_punta','medio','defensa','portero']; // arriba → abajo

let LIBRO_TIPOS_SEL = null;   // Set de ids de tipo de partido seleccionados (null = todos)
let LIBRO_DATOS = null;       // datos cargados de todos los partidos
let LIBRO_PAGINAS = null;     // { clave, paginas:[dataUrl], titulo }
let LIBRO_GENERANDO = false;

async function cargarDatosLibro(){
  const idsPartidos = PARTIDOS.map(p => p.id);
  if(!idsPartidos.length) return { cuartosPorPartido: {}, noConvocadosPorPartido: {} };
  const { data: noConv } = await sb.from('alevin_d_no_convocados')
    .select('partido_id, alevin_d_jugadores(nombre), alevin_d_motivos_no_convocatoria(nombre)').in('partido_id', idsPartidos);
  const noConvocadosPorPartido = {};
  (noConv || []).forEach(r => { (noConvocadosPorPartido[r.partido_id] ||= []).push(r); });
  const { data: cuartos } = await sb.from('alevin_d_cuartos').select('*').in('partido_id', idsPartidos).order('numero');
  const idsCuartos = (cuartos||[]).map(c => c.id);
  let alineaciones = [], goles = [];
  if(idsCuartos.length){
    const [alRes, glRes] = await Promise.all([
      sb.from('alevin_d_alineacion_cuarto').select('*, alevin_d_jugadores(nombre)').in('cuarto_id', idsCuartos),
      sb.from('alevin_d_goles').select('*, autor:alevin_d_jugadores!alevin_d_goles_jugador_id_fkey(nombre), asistente:alevin_d_jugadores!alevin_d_goles_asistente_id_fkey(nombre)').in('cuarto_id', idsCuartos)
    ]);
    alineaciones = alRes.data || [];
    goles = glRes.data || [];
  }
  const cuartosPorPartido = {};
  (cuartos||[]).forEach(c => {
    if(!cuartosPorPartido[c.partido_id]) cuartosPorPartido[c.partido_id] = [];
    cuartosPorPartido[c.partido_id].push({
      ...c,
      alineacion: alineaciones.filter(a => a.cuarto_id === c.id),
      goles: goles.filter(g => g.cuarto_id === c.id)
    });
  });
  return { cuartosPorPartido, noConvocadosPorPartido };
}

/* ---------- temporada, secciones y títulos ---------- */
function temporadaDeFecha(fecha){
  const d = new Date((fecha || '') + 'T00:00:00');
  if(isNaN(d)) return '';
  const anio = d.getFullYear();
  const ini = d.getMonth() >= 6 ? anio : anio - 1; // la temporada empieza en julio/agosto
  const dos = n => String(n % 100).padStart(2, '0');
  return `${dos(ini)}-${dos(ini + 1)}`;
}
function tituloSeccionLibro(tipo, temporada){
  // "Pretemporada Temporada 26-27 Alevín D San Cayetano" · "Liga 26-27 Alevín D San Cayetano"
  const prefijo = /pretemporada/i.test(tipo) ? `${tipo} Temporada` : tipo;
  return `${prefijo} ${temporada} ${NOMBRE_COMPLETO_EQUIPO}`.replace(/\s+/g, ' ').trim();
}
function construirSeccionesLibro(tiposSel){
  const grupos = {};
  PARTIDOS.forEach(p => {
    if(tiposSel && !tiposSel.has(p.tipo_partido_id)) return;
    const tipo = p.alevin_d_tipos_partido?.nombre ?? 'Partidos';
    const temp = temporadaDeFecha(p.fecha);
    const clave = tipo + '|' + temp;
    (grupos[clave] ||= { tipo, temporada: temp, partidos: [] }).partidos.push(p);
  });
  const secciones = Object.values(grupos);
  secciones.forEach(s => s.partidos.sort((a,b) => (a.fecha||'').localeCompare(b.fecha||'') || (a.hora||'').localeCompare(b.hora||'')));
  secciones.sort((a,b) => (a.partidos[0].fecha||'').localeCompare(b.partidos[0].fecha||''));
  secciones.forEach(s => {
    s.titulo = tituloSeccionLibro(s.tipo, s.temporada);
    // líneas de la portada: "Pretemporada Temporada" / "26-27" / "Alevín D San Cayetano"
    s.lineasPortada = [/pretemporada/i.test(s.tipo) ? `${s.tipo} Temporada` : s.tipo, s.temporada, NOMBRE_COMPLETO_EQUIPO].filter(Boolean);
  });
  return secciones;
}
function resultadoPartidoLibro(p, cuartos){
  if(p.goles_favor != null && p.goles_contra != null) return { ge: p.goles_favor, gr: p.goles_contra, ok: true };
  const hay = cuartos.some(c => c.goles_equipo != null || c.goles_rival != null);
  if(!hay) return { ge: null, gr: null, ok: false };
  return { ge: cuartos.reduce((s,c)=> s + (c.goles_equipo||0), 0), gr: cuartos.reduce((s,c)=> s + (c.goles_rival||0), 0), ok: true };
}

/* ---------- utilidades de dibujo ---------- */
function trazoRedondeado(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function recortarTexto(ctx, texto, maxW){
  if(ctx.measureText(texto).width <= maxW) return texto;
  let t = texto;
  while(t.length > 1 && ctx.measureText(t + '…').width > maxW) t = t.slice(0, -1);
  return t + '…';
}
// Reduce el tamaño de fuente hasta que el texto cabe en maxW.
function fuenteAjustada(ctx, texto, familia, tamMax, tamMin, maxW, peso){
  let tam = tamMax;
  do { ctx.font = `${peso || ''} ${tam}px ${familia}`.trim(); tam -= 2; }
  while(ctx.measureText(texto).width > maxW && tam >= tamMin);
  return tam + 2;
}
function partirEnLineas(ctx, texto, maxW){
  const palabras = texto.split(' ');
  const lineas = [];
  let actual = '';
  palabras.forEach(pal => {
    const prueba = actual ? actual + ' ' + pal : pal;
    if(ctx.measureText(prueba).width > maxW && actual){ lineas.push(actual); actual = pal; }
    else actual = prueba;
  });
  if(actual) lineas.push(actual);
  return lineas;
}
// Letras "de cartel": relleno, contorno y sombra.
function textoCartel(ctx, texto, x, y, relleno, contorno, grosor, sombra){
  ctx.save();
  ctx.lineJoin = 'round';
  if(sombra){ ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = 0; ctx.shadowOffsetX = 4; ctx.shadowOffsetY = 6; }
  if(contorno && grosor){ ctx.lineWidth = grosor; ctx.strokeStyle = contorno; ctx.strokeText(texto, x, y); }
  ctx.shadowColor = 'transparent';
  ctx.fillStyle = relleno;
  ctx.fillText(texto, x, y);
  ctx.restore();
}
function nuevoLienzo(){
  const canvas = document.createElement('canvas');
  canvas.width = PAG_W; canvas.height = PAG_H;
  return { canvas, ctx: canvas.getContext('2d') };
}
function canvasADataUrl(canvas){ return canvas.toDataURL('image/jpeg', 0.88); }

/* ---------- portada de sección ---------- */
function dibujarPortadaSeccion(seccion){
  const { canvas, ctx } = nuevoLienzo();
  const g = ctx.createLinearGradient(0, 0, 0, PAG_H);
  g.addColorStop(0, '#1e3a8a'); g.addColorStop(1, '#0b1b4d');
  ctx.fillStyle = g; ctx.fillRect(0, 0, PAG_W, PAG_H);
  // franjas decorativas
  ctx.save();
  ctx.globalAlpha = .08; ctx.fillStyle = '#fff';
  for(let i = -2; i < 12; i++){ ctx.save(); ctx.translate(i * 220, 0); ctx.rotate(-0.35); ctx.fillRect(0, -200, 90, PAG_H * 1.6); ctx.restore(); }
  ctx.restore();
  // marco
  ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 10; trazoRedondeado(ctx, 50, 50, PAG_W - 100, PAG_H - 100, 40); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 3; trazoRedondeado(ctx, 74, 74, PAG_W - 148, PAG_H - 148, 30); ctx.stroke();
  // balón
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.font = '170px sans-serif'; ctx.fillText('⚽', PAG_W / 2, 480);
  // título en letras de cartel
  const maxW = PAG_W - 260;
  const lineas = seccion.lineasPortada;
  // cada línea con el mayor tamaño que le quepa (la 1ª, más grande; la del equipo, algo menor)
  const maxTam = [190, 230, 110];
  let y = 560;
  lineas.forEach((l, i) => {
    const tam = fuenteAjustada(ctx, l, FUENTE_TITULO, maxTam[i] || 110, 40, maxW);
    ctx.font = `${tam}px ${FUENTE_TITULO}`;
    y += tam * 0.95; // la línea base va debajo de la anterior
    const col = i === 1 ? '#ffffff' : '#fde047';
    textoCartel(ctx, l, PAG_W / 2, y, col, '#0b1b4d', Math.max(10, tam * .12), true);
    y += tam * 0.12 + 24;
  });
  // pie
  ctx.font = `46px ${FUENTE_TITULO}`;
  textoCartel(ctx, `${seccion.partidos.length} ${seccion.partidos.length === 1 ? 'partido' : 'partidos'}`, PAG_W / 2, PAG_H - 160, '#ffffff', '#0b1b4d', 8, false);
  return canvasADataUrl(canvas);
}

/* ---------- campo con la alineación de un cuarto ---------- */
function dibujarCampoCuarto(ctx, x, y, w, h, numero, cuarto, p){
  // cabecera del cuarto
  const altCab = 46;
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.font = `38px ${FUENTE_TITULO}`;
  textoCartel(ctx, `CUARTO ${numero}`, x, y + altCab / 2, '#1e3a8a', null, 0, false);
  if(cuarto && (cuarto.goles_equipo != null || cuarto.goles_rival != null)){
    ctx.textAlign = 'right';
    textoCartel(ctx, textoMarcador(p, cuarto.goles_equipo, cuarto.goles_rival), x + w, y + altCab / 2, '#15803d', null, 0, false);
  }
  const cy = y + altCab, ch = h - altCab;
  const g = ctx.createLinearGradient(0, cy, 0, cy + ch);
  g.addColorStop(0, '#22a04a'); g.addColorStop(1, '#166b30');
  ctx.fillStyle = g; trazoRedondeado(ctx, x, cy, w, ch, 18); ctx.fill();
  // marcas del campo
  ctx.save();
  trazoRedondeado(ctx, x, cy, w, ch, 18); ctx.clip();
  ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 3;
  ctx.strokeRect(x + 14, cy + 14, w - 28, ch - 28);
  ctx.beginPath(); ctx.moveTo(x + 14, cy + ch / 2); ctx.lineTo(x + w - 14, cy + ch / 2); ctx.stroke();
  ctx.beginPath(); ctx.arc(x + w / 2, cy + ch / 2, ch * .13, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeRect(x + w * .3, cy + ch - 14 - ch * .16, w * .4, ch * .16); // área propia (abajo)
  ctx.strokeRect(x + w * .3, cy + 14, w * .4, ch * .16);
  ctx.restore();

  const al = cuarto?.alineacion || [];
  if(!al.length){
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '26px system-ui, sans-serif'; ctx.fillStyle = 'rgba(255,255,255,.85)';
    ctx.fillText(cuarto ? 'Sin alineación guardada' : 'Cuarto no jugado', x + w / 2, cy + ch / 2);
    return;
  }
  const porLinea = {};
  al.slice().sort((a,b) => a.orden_en_linea - b.orden_en_linea).forEach(a => { (porLinea[a.linea] ||= []).push(a); });
  const lineas = ORDEN_VISUAL_LINEAS.filter(l => porLinea[l] && porLinea[l].length);
  const pillH = Math.min(62, (ch - 36) / lineas.length - 8);
  const margen = 22;
  lineas.forEach((l, i) => {
    const filaY = cy + margen + (ch - 2 * margen - pillH) * (lineas.length === 1 ? .5 : i / (lineas.length - 1));
    const jugs = porLinea[l].slice().reverse(); // el primero introducido va a la derecha
    const n = jugs.length;
    const pillW = Math.min(124, (w - 2 * margen - (n - 1) * 8) / n);
    const total = n * pillW + (n - 1) * 8;
    let px = x + (w - total) / 2;
    jugs.forEach(a => {
      ctx.fillStyle = 'rgba(255,255,255,.94)';
      trazoRedondeado(ctx, px, filaY, pillW, pillH, 10); ctx.fill();
      ctx.strokeStyle = '#1d4ed8'; ctx.lineWidth = 2; ctx.stroke();
      ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
      ctx.fillStyle = '#1e3a8a'; ctx.font = `bold ${Math.round(pillH * .31)}px system-ui, sans-serif`;
      ctx.fillText(a.posicion_codigo || '?', px + pillW / 2, filaY + pillH * .38);
      ctx.fillStyle = '#1f2430'; ctx.font = `${Math.round(pillH * .30)}px system-ui, sans-serif`;
      ctx.fillText(recortarTexto(ctx, a.alevin_d_jugadores?.nombre ?? '?', pillW - 8), px + pillW / 2, filaY + pillH * .8);
      px += pillW + 8;
    });
  });
}

/* ---------- página de un partido ---------- */
function dibujarPaginaPartido(seccion, p, cuartos, noConv, imgCartel){
  const { canvas, ctx } = nuevoLienzo();
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, PAG_W, PAG_H);
  const mx = 70; const anchoUtil = PAG_W - 2 * mx;

  // banda superior con el título de la sección
  const gb = ctx.createLinearGradient(0, 0, PAG_W, 0);
  gb.addColorStop(0, '#1e3a8a'); gb.addColorStop(1, '#1d4ed8');
  ctx.fillStyle = gb; ctx.fillRect(0, 0, PAG_W, 78);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const tamBanda = fuenteAjustada(ctx, seccion.titulo, FUENTE_TITULO, 46, 24, PAG_W - 120);
  ctx.font = `${tamBanda}px ${FUENTE_TITULO}`;
  textoCartel(ctx, seccion.titulo, PAG_W / 2, 42, '#fde047', '#0b1b4d', 6, false);

  // cartel de la convocatoria (con los escudos y el rótulo del partido)
  let y = 100;
  if(imgCartel){
    const maxH = 470;
    const esc = Math.min(anchoUtil / imgCartel.width, maxH / imgCartel.height);
    const w = imgCartel.width * esc, h = imgCartel.height * esc;
    const x = (PAG_W - w) / 2;
    ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.25)'; ctx.shadowBlur = 14; ctx.shadowOffsetY = 4;
    ctx.fillStyle = '#fff'; trazoRedondeado(ctx, x, y, w, h, 16); ctx.fill(); ctx.restore();
    ctx.save(); trazoRedondeado(ctx, x, y, w, h, 16); ctx.clip(); ctx.drawImage(imgCartel, x, y, w, h); ctx.restore();
    y += h + 26;
  } else {
    // sin cartel: rótulo de texto
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    const t = `${NOMBRE_EQUIPO} vs ${p.rival}`;
    ctx.font = `${fuenteAjustada(ctx, t, FUENTE_TITULO, 96, 40, anchoUtil)}px ${FUENTE_TITULO}`;
    textoCartel(ctx, t, PAG_W / 2, y + 110, '#1e3a8a', '#fde047', 8, true);
    y += 170;
  }

  // fecha / hora / condición
  const f = p.fecha ? new Date(p.fecha + 'T00:00:00').toLocaleDateString('es-ES', { weekday:'long', day:'numeric', month:'long', year:'numeric' }) : '';
  const info = [f, p.hora ? p.hora.slice(0,5) + ' h' : '', p.condicion ? (p.condicion === 'fuera' ? 'Fuera' : 'Casa') : ''].filter(Boolean).join('  ·  ');
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.font = '30px system-ui, sans-serif'; ctx.fillStyle = '#475569';
  ctx.fillText(info.charAt(0).toUpperCase() + info.slice(1), PAG_W / 2, y + 22);
  y += 56;

  // resultado (el equipo local siempre primero)
  const r = resultadoPartidoLibro(p, cuartos);
  const fuera = p.condicion === 'fuera';
  const nombreLocal = fuera ? p.rival : NOMBRE_EQUIPO;
  const nombreVisit = fuera ? NOMBRE_EQUIPO : p.rival;
  const marcador = r.ok ? textoMarcador(p, r.ge, r.gr) : '? - ?';
  ctx.font = `130px ${FUENTE_TITULO}`;
  const anchoMarc = ctx.measureText(marcador).width;
  const cx = PAG_W / 2;
  textoCartel(ctx, marcador, cx, y + 105, '#1e3a8a', '#fde047', 10, true);
  const maxNom = (anchoUtil - anchoMarc) / 2 - 30;
  ctx.textAlign = 'right';
  ctx.font = `${fuenteAjustada(ctx, nombreLocal, FUENTE_TITULO, 54, 26, maxNom)}px ${FUENTE_TITULO}`;
  textoCartel(ctx, nombreLocal, cx - anchoMarc / 2 - 24, y + 90, '#1f2430', null, 0, false);
  ctx.textAlign = 'left';
  ctx.font = `${fuenteAjustada(ctx, nombreVisit, FUENTE_TITULO, 54, 26, maxNom)}px ${FUENTE_TITULO}`;
  textoCartel(ctx, nombreVisit, cx + anchoMarc / 2 + 24, y + 90, '#1f2430', null, 0, false);
  if(r.ok && !(p.goles_favor != null && p.goles_contra != null)){
    ctx.textAlign = 'center'; ctx.font = '22px system-ui, sans-serif'; ctx.fillStyle = '#94a3b8';
    ctx.fillText('(suma de los cuartos)', cx, y + 138);
  }
  y += 160;

  // goleadores y asistentes
  const goles = [];
  cuartos.slice().sort((a,b) => a.numero - b.numero).forEach(c => c.goles.forEach(g => goles.push({ c: c.numero, g })));
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.font = `40px ${FUENTE_TITULO}`;
  textoCartel(ctx, 'GOLES', mx, y + 30, '#15803d', null, 0, false);
  let yg = y + 62;
  const colW = anchoUtil / 2;
  const tamLinea = goles.length > 10 ? 26 : 30;
  const paso = tamLinea + 12;
  ctx.font = `${tamLinea}px system-ui, sans-serif`; ctx.fillStyle = '#1f2430';
  if(!goles.length){
    ctx.fillStyle = '#94a3b8'; ctx.fillText(r.ok && (r.ge === 0 || r.ge == null) ? 'Sin goles de Alevín D' : 'Sin goles registrados', mx, yg + 20);
    yg += paso;
  } else {
    const porCol = Math.ceil(goles.length / 2);
    goles.forEach((it, i) => {
      const col = i < porCol ? 0 : 1;
      const fila = i < porCol ? i : i - porCol;
      const gx = mx + col * colW, gy = yg + 20 + fila * paso;
      const autor = it.g.autor?.nombre ?? '?';
      ctx.fillStyle = '#1f2430'; ctx.font = `bold ${tamLinea}px system-ui, sans-serif`;
      const pre = `⚽ ${autor}`;
      ctx.fillText(recortarTexto(ctx, pre, colW - 20), gx, gy);
      if(it.g.asistente){
        const w0 = ctx.measureText(pre).width;
        ctx.fillStyle = '#475569'; ctx.font = `${tamLinea - 2}px system-ui, sans-serif`;
        const txt = ` (asist. ${it.g.asistente.nombre}) · C${it.c}`;
        if(w0 + ctx.measureText(txt).width < colW - 20) ctx.fillText(txt, gx + w0, gy);
        else ctx.fillText(recortarTexto(ctx, txt, Math.max(40, colW - 20 - w0)), gx + w0, gy);
      } else {
        const w0 = ctx.measureText(pre).width;
        ctx.fillStyle = '#475569'; ctx.font = `${tamLinea - 2}px system-ui, sans-serif`;
        ctx.fillText(` · C${it.c}`, gx + w0, gy);
      }
    });
    yg += Math.ceil(goles.length / 2) * paso;
  }
  y = yg + 8;

  // no convocados
  if(noConv && noConv.length){
    ctx.font = '22px system-ui, sans-serif'; ctx.fillStyle = '#64748b'; ctx.textAlign = 'left';
    const txt = 'No convocados: ' + noConv.map(r2 => `${r2.alevin_d_jugadores?.nombre ?? '?'}${r2.alevin_d_motivos_no_convocatoria?.nombre ? ' (' + r2.alevin_d_motivos_no_convocatoria.nombre + ')' : ''}`).join(', ');
    partirEnLineas(ctx, txt, anchoUtil).slice(0, 2).forEach((l, i) => ctx.fillText(l, mx, y + 20 + i * 28));
    y += 8 + Math.min(2, partirEnLineas(ctx, txt, anchoUtil).length) * 28 + 8;
  }

  // 4 campos (2 × 2)
  const finY = PAG_H - 50;
  const gap = 30;
  const celdaW = (anchoUtil - gap) / 2;
  const celdaH = (finY - y - gap) / 2;
  for(let n = 1; n <= 4; n++){
    const col = (n - 1) % 2, fila = Math.floor((n - 1) / 2);
    const cuarto = cuartos.find(c => c.numero === n);
    dibujarCampoCuarto(ctx, mx + col * (celdaW + gap), y + fila * (celdaH + gap), celdaW, celdaH, n, cuarto, p);
  }
  return canvasADataUrl(canvas);
}

/* ---------- generación ---------- */
async function descargarCartel(path){
  if(!path) return null;
  try {
    const { data, error } = await sb.storage.from('alevin-d-fotos').download(path);
    if(error || !data) return null;
    return await createImageBitmap(data);
  } catch(e){ return null; }
}
function claveSeleccionLibro(){
  return [...(LIBRO_TIPOS_SEL || [])].sort().join(',');
}
async function generarPaginasLibro(progreso){
  try { await document.fonts.load(`64px Bangers`); } catch(e){}
  if(!LIBRO_DATOS) LIBRO_DATOS = await cargarDatosLibro();
  const secciones = construirSeccionesLibro(LIBRO_TIPOS_SEL);
  const total = secciones.reduce((s, sec) => s + 1 + sec.partidos.length, 0);
  const paginas = [];
  let hecho = 0;
  for(const sec of secciones){
    paginas.push(dibujarPortadaSeccion(sec));
    progreso(++hecho, total);
    for(const p of sec.partidos){
      const cuartos = (LIBRO_DATOS.cuartosPorPartido[p.id] || []).slice().sort((a,b) => a.numero - b.numero);
      const img = await descargarCartel(p.foto_convocatoria_path);
      paginas.push(dibujarPaginaPartido(sec, p, cuartos, LIBRO_DATOS.noConvocadosPorPartido[p.id], img));
      if(img && img.close) img.close();
      progreso(++hecho, total);
      await new Promise(r => setTimeout(r, 0)); // deja respirar a la interfaz
    }
  }
  return paginas;
}
function seleccionTiposLibro(){
  const marcados = [...document.querySelectorAll('.libro-tipo:checked')].map(c => parseInt(c.value, 10));
  LIBRO_TIPOS_SEL = new Set(marcados);
  return LIBRO_TIPOS_SEL;
}
async function prepararLibro(boton, estadoId){
  const sel = seleccionTiposLibro();
  const estado = document.getElementById(estadoId);
  if(!sel.size){ estado.innerHTML = '<div class="aviso">Marca al menos un tipo de partido.</div>'; return null; }
  if(LIBRO_GENERANDO) return null;
  LIBRO_GENERANDO = true;
  try {
    estado.innerHTML = '<span class="spinner" style="border-color:#777;"></span><span id="libro-prog">Preparando…</span>';
    LIBRO_DATOS = await cargarDatosLibro(); // siempre datos frescos
    const paginas = await generarPaginasLibro((h, t) => {
      const el = document.getElementById('libro-prog'); if(el) el.textContent = `Dibujando página ${h} de ${t}…`;
    });
    LIBRO_PAGINAS = { clave: claveSeleccionLibro(), paginas };
    estado.innerHTML = `<div class="ok">Libro listo: ${paginas.length} páginas.</div>`;
    return LIBRO_PAGINAS;
  } catch(e){
    estado.innerHTML = `<div class="aviso">No se pudo generar el libro: ${e.message}</div>`;
    return null;
  } finally { LIBRO_GENERANDO = false; }
}
async function verLibro(boton){
  await conSpinner(boton, 'Generando…', async () => {
    const libro = await prepararLibro(boton, 'libro-estado');
    if(!libro) return;
    document.getElementById('libro-paginas').innerHTML = libro.paginas.map((src, i) =>
      `<img class="libro-pagina" src="${src}" alt="Página ${i + 1}">`).join('');
  });
}
async function descargarLibroPdf(boton){
  if(!window.jspdf){ return alert('No se ha cargado la librería de PDF (jsPDF). Comprueba la conexión y recarga.'); }
  await conSpinner(boton, 'Generando PDF…', async () => {
    let libro = LIBRO_PAGINAS;
    const sel = seleccionTiposLibro();
    if(!libro || libro.clave !== claveSeleccionLibro()) libro = await prepararLibro(boton, 'libro-estado');
    if(!libro) return;
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait', compress: true });
    libro.paginas.forEach((src, i) => {
      if(i > 0) doc.addPage();
      doc.addImage(src, 'JPEG', 0, 0, 210, 297, undefined, 'FAST');
    });
    const nombresTipos = TIPOS_PARTIDO.filter(t => sel.has(t.id)).map(t => t.nombre).join('-');
    const nombre = `Libro Alevin D ${sel.size === TIPOS_PARTIDO.length ? 'completo' : nombresTipos}.pdf`.replace(/[^\w .-]/g, '');
    doc.save(nombre);
  });
}

/* ============================================================
   ESTADÍSTICAS — cuartos jugados, goles, asistencias y goles
   encajados (para quien jugó de portero), calculado a partir de
   lo guardado en cada cuarto. Sirve también para comprobar que
   todo se está guardando correctamente.
   ============================================================ */
async function cargarEstadisticas(){
  const { data: alineaciones } = await sb
    .from('alevin_d_alineacion_cuarto')
    .select('jugador_id, linea, cuarto_id, alevin_d_cuartos(goles_rival)');
  const { data: goles } = await sb
    .from('alevin_d_goles')
    .select('jugador_id, asistente_id');
  return { alineaciones: alineaciones || [], goles: goles || [] };
}
function calcularEstadisticasJugadores(alineaciones, goles){
  const stats = {};
  function obtener(jid){
    if(!stats[jid]) stats[jid] = { cuartosJugados: new Set(), goles: 0, asistencias: 0, cuartosPortero: new Set(), golesEncajados: 0 };
    return stats[jid];
  }
  alineaciones.forEach(a => {
    const s = obtener(a.jugador_id);
    s.cuartosJugados.add(a.cuarto_id);
    if(a.linea === 'portero'){
      s.cuartosPortero.add(a.cuarto_id);
      const gr = a.alevin_d_cuartos?.goles_rival;
      if(gr != null) s.golesEncajados += gr;
    }
  });
  goles.forEach(g => {
    if(g.jugador_id) obtener(g.jugador_id).goles += 1;
    if(g.asistente_id) obtener(g.asistente_id).asistencias += 1;
  });
  return stats;
}
async function renderEstadisticas(){
  const main = document.getElementById('main');
  main.innerHTML = '<p class="muted">Calculando estadísticas…</p>';
  const { alineaciones, goles } = await cargarEstadisticas();
  const stats = calcularEstadisticasJugadores(alineaciones, goles);
  const filas = JUGADORES
    .slice()
    .sort((a,b) => (b.activo - a.activo) || a.nombre.localeCompare(b.nombre))
    .map(j => {
      const s = stats[j.id];
      if(!s && !j.activo) return ''; // ocultar bajas sin ningún dato histórico
      const cuartosJugados = s ? s.cuartosJugados.size : 0;
      const cuartosPortero = s ? s.cuartosPortero.size : 0;
      const portero = cuartosPortero
        ? `${cuartosPortero} <span class="muted">(${s.golesEncajados} encajados)</span>`
        : '—';
      return `<tr>
        <td>${j.dorsal ?? '-'}</td>
        <td>${nombreConAlias(j)}${!j.activo ? ' <span class="badge">baja</span>' : ''}</td>
        <td>${cuartosJugados}</td>
        <td>${s ? s.goles : 0}</td>
        <td>${s ? s.asistencias : 0}</td>
        <td>${portero}</td>
      </tr>`;
    }).join('');
  main.innerHTML = `
    <div class="card">
      <h2>Estadísticas de la plantilla</h2>
      <p class="muted">Calculadas a partir de los cuartos y goles ya guardados — también sirve para comprobar de un vistazo que todo se está registrando bien.</p>
      <div class="tabla-wrap"><table>
        <thead><tr><th>Dorsal</th><th>Jugador</th><th>Cuartos jugados</th><th>Goles</th><th>Asistencias</th><th>De portero (encajados)</th></tr></thead>
        <tbody>${filas || '<tr><td colspan="6" class="muted">Sin datos todavía.</td></tr>'}</tbody>
      </table></div>
    </div>`;
}

async function crearTipoPartidoAdmin(){
