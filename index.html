<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alevín D</title>
<style>
  :root{
    --azul:#1d4ed8; --azul-osc:#1e3a8a; --gris:#f4f5f7; --borde:#d8dbe0;
    --texto:#1f2430; --verde:#15803d; --rojo:#b91c1c;
  }
  *{box-sizing:border-box;}
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:var(--gris);color:var(--texto);}
  header{background:var(--azul-osc);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
  header h1{font-size:18px;margin:0;}
  nav{display:flex;gap:6px;}
  nav button{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:14px;}
  nav button.activo{background:#fff;color:var(--azul-osc);font-weight:600;}
  main{max-width:900px;margin:0 auto;padding:16px;}
  .card{background:#fff;border:1px solid var(--borde);border-radius:8px;padding:16px;margin-bottom:16px;}
  h2{margin-top:0;font-size:17px;}
  h3{font-size:15px;margin:14px 0 8px;}
  label{display:block;font-size:12px;color:#555;margin-bottom:2px;}
  input,select{padding:6px 8px;border:1px solid var(--borde);border-radius:5px;font-size:14px;width:100%;}
  .fila{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px;}
  .fila > div{flex:1;min-width:120px;}
  button.btn{background:var(--azul);color:#fff;border:none;padding:7px 14px;border-radius:6px;cursor:pointer;font-size:14px;}
  button.btn.sec{background:#fff;color:var(--azul);border:1px solid var(--azul);}
  button.btn.danger{background:#fff;color:var(--rojo);border:1px solid var(--rojo);}
  button.chip-x{background:none;border:none;color:#b91c1c;cursor:pointer;font-weight:bold;margin-left:4px;}
  table{width:100%;border-collapse:collapse;font-size:14px;}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--borde);}
  .badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px;background:#e5e7eb;}
  .badge.fijo{background:#dbeafe;color:var(--azul-osc);}
  .badge.temporal{background:#fef3c7;color:#92400e;}
  .badge.amistoso{background:#e5e7eb;}
  .badge.liga{background:#dcfce7;color:var(--verde);}
  .linea-box{border:1px dashed var(--borde);border-radius:6px;padding:10px;margin-bottom:10px;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0;}
  .chip{background:var(--gris);border:1px solid var(--borde);border-radius:20px;padding:4px 10px;font-size:13px;display:flex;align-items:center;}
  .chip input{width:70px;border:none;background:transparent;padding:0;margin-left:6px;font-size:12px;color:#555;}
  .partido-item{cursor:pointer;padding:10px;border-bottom:1px solid var(--borde);}
  .partido-item:hover{background:var(--gris);}
  .oculto{display:none !important;}
  .aviso{background:#fef2f2;border:1px solid #fecaca;color:var(--rojo);padding:8px 10px;border-radius:6px;font-size:13px;margin-bottom:10px;}
  .ok{background:#f0fdf4;border:1px solid #bbf7d0;color:var(--verde);padding:8px 10px;border-radius:6px;font-size:13px;margin-bottom:10px;}
  .muted{color:#777;font-size:13px;}
  .volver{background:none;border:none;color:var(--azul);cursor:pointer;font-size:14px;margin-bottom:10px;padding:0;}
  .tabla-wrap{overflow-x:auto;}
  .spinner{display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:girar .6s linear infinite;vertical-align:middle;margin-right:6px;opacity:.85;}
  @keyframes girar{to{transform:rotate(360deg);}}
  .campo{background:linear-gradient(#1f8a3d,#166b30);border-radius:8px;padding:10px 6px;margin-bottom:10px;}
  .campo-linea{display:flex;flex-direction:row-reverse;gap:6px;justify-content:center;flex-wrap:wrap;padding:6px 0;}
  .campo-jugador{background:rgba(255,255,255,.92);border:1px solid var(--azul);border-radius:6px;padding:3px 6px;font-size:12px;text-align:center;min-width:56px;}
  .campo-jugador .cod{font-weight:600;}
  .campo-jugador .nom{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:78px;margin:0 auto;}
  .gol-rapido{background:none;border:none;color:var(--verde);cursor:pointer;font-weight:bold;font-size:12px;padding:0 2px;}
  .resultado-total{font-size:20px;font-weight:700;margin:4px 0;}

  @media (max-width: 600px){
    header{flex-direction:column;align-items:stretch;padding:10px 12px;}
    header h1{text-align:center;margin-bottom:4px;}
    nav{justify-content:center;}
    nav button{flex:1;min-width:0;padding:8px 6px;font-size:13px;}
    main{padding:10px;}
    .card{padding:12px;}
    .fila{flex-direction:column;}
    .fila > div{min-width:0;}
    table{font-size:13px;}
    th,td{padding:5px 4px;}
  }
</style>
</head>
<body>

<div id="auth-gate" class="card" style="max-width:360px;margin:60px auto;">
  <h2>Alevín D · acceso</h2>
  <div id="auth-msg"></div>
  <div id="auth-form">
    <label>Email</label>
    <input id="auth-email" type="email" placeholder="tu@email.com" value="andres.alarcon@gmail.com">
    <label style="margin-top:8px;">Contraseña</label>
    <input id="auth-password" type="password" placeholder="••••••••">
    <div style="height:10px;"></div>
    <button class="btn" onclick="entrar(this)">Entrar</button>
    <button class="btn sec" onclick="crearCuenta(this)">Crear cuenta (solo la primera vez)</button>
    <p class="muted">La sesión se mantiene guardada en este dispositivo — no hace falta volver a entrar cada partido.</p>
  </div>
</div>

<div id="app" class="oculto">
  <header>
    <h1>⚽ Alevín D</h1>
    <nav>
      <button id="nav-jugadores" onclick="irA('jugadores')">Jugadores</button>
      <button id="nav-partidos" onclick="irA('partidos')">Partidos</button>
      <button id="nav-libro" onclick="irA('libro')">Libro (PDF)</button>
      <button id="nav-estadisticas" onclick="irA('estadisticas')">Estadísticas</button>
      <button id="nav-actual" onclick="irAPartidoActual()" class="oculto">⚡ Partido actual</button>
      <button id="nav-admin" onclick="irA('admin')">Admin</button>
      <button onclick="cerrarSesion()" style="margin-left:8px;">Salir</button>
    </nav>
  </header>
  <main id="main"></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
/* ============================================================
   CONFIG
   ============================================================ */
const SUPABASE_URL = 'https://fxgjzfpasyxwiegmiwzb.supabase.co';
const SUPABASE_KEY = 'sb_publishable_xR-MTLBo-EU6l7h54jyPYQ_LqmdN71A';
const EMAIL_AUTORIZADO = 'andres.alarcon@gmail.com';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ============================================================
   TABLA DE CÓDIGOS DE POSICIÓN
   Convención: el equipo ataca hacia abajo del papel; dentro de
   cada línea, el primer jugador introducido es siempre el más a
   la derecha, el último el más a la izquierda.
   ============================================================ */
const TABLA_POSICIONES = {
  portero:      { 1: ['GK'] },
  defensa:      { 1: ['DCC'], 2: ['DCD','DCI'], 3: ['LD','DCC','LI'], 4: ['LD','DCD','DCI','LI'] },
  medio:        { 1: ['MC'],  2: ['MCD','MCI'],  3: ['MCD','MC','MCI'], 4: ['MD','MCD','MCI','MI'] },
  media_punta:  { 1: ['MP'] },
  delantero:    { 1: ['DC'],  2: ['DD','DI'],     3: ['ED','DC','EI'] },
};
const NOMBRE_LINEA = { portero:'Portero', defensa:'Defensa', medio:'Medio', media_punta:'Media punta', delantero:'Delantero' };

// Dado el tipo de línea y el nº de jugadores, devuelve los códigos en
// orden (derecha → izquierda). Si no hay una entrada exacta en la
// tabla, devuelve null y el llamante debe pedir los códigos a mano.
function calcularCodigos(linea, n){
  const tabla = TABLA_POSICIONES[linea];
  if (tabla && tabla[n]) return tabla[n].slice();
  return null;
}

/* ============================================================
   ESTADO
   ============================================================ */
let SESSION = null;
let JUGADORES = [];
let TIPOS_PARTIDO = [];
let TIPOS_JUGADOR = [];
let PARTIDOS = [];
let VISTA = 'jugadores';
let PARTIDO_ACTUAL = null; // id del partido abierto en detalle
let RESUMEN_CUARTOS_POR_PARTIDO = {}; // { [partido_id]: {ge, gr, tiene} } — para el listado de partidos

/* ============================================================
   SPINNER genérico para botones de guardar/crear/eliminar
   ============================================================ */
async function conSpinner(boton, textoCargando, fn){
  if(!boton){ return await fn(); }
  const original = boton.innerHTML;
  boton.disabled = true;
  boton.innerHTML = `<span class="spinner"></span>${textoCargando}`;
  try {
    return await fn();
  } finally {
    boton.disabled = false;
    boton.innerHTML = original;
  }
}

/* ============================================================
   PERSISTENCIA DE NAVEGACIÓN — recordar la última pantalla y el
   último partido abierto, para no volver siempre a "Jugadores"
   tras recargar, y para el acceso directo "Partido actual".
   ============================================================ */
function guardarVista(vista){ try{ localStorage.setItem('alevin_d_vista', vista); }catch(e){} }
function leerVistaGuardada(){ try{ return localStorage.getItem('alevin_d_vista'); }catch(e){ return null; } }
function guardarPartidoActualId(id){ try{ localStorage.setItem('alevin_d_partido_actual_id', id); }catch(e){} }
function leerPartidoActualId(){ try{ return localStorage.getItem('alevin_d_partido_actual_id'); }catch(e){ return null; } }
function actualizarBotonPartidoActual(){
  const btn = document.getElementById('nav-actual');
  if(!btn) return;
  const id = leerPartidoActualId();
  const existe = !!(id && PARTIDOS.some(p => p.id === id));
  btn.classList.toggle('oculto', !existe);
  btn.classList.toggle('activo', existe && PARTIDO_ACTUAL === id);
}
function irAPartidoActual(){
  const id = leerPartidoActualId();
  if(id) abrirPartido(id);
}

/* ============================================================
   AUTENTICACIÓN
   ============================================================ */
async function entrar(boton){
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  const msg = document.getElementById('auth-msg');
  if(!email || !password){ msg.innerHTML = '<div class="aviso">Introduce email y contraseña.</div>'; return; }
  await conSpinner(boton, 'Entrando…', async () => {
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if(error){ msg.innerHTML = `<div class="aviso">${error.message}</div>`; return; }
    msg.innerHTML = '';
  });
}
async function crearCuenta(boton){
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  const msg = document.getElementById('auth-msg');
  if(!email || !password){ msg.innerHTML = '<div class="aviso">Introduce email y contraseña.</div>'; return; }
  if(password.length < 6){ msg.innerHTML = '<div class="aviso">La contraseña debe tener al menos 6 caracteres.</div>'; return; }
  await conSpinner(boton, 'Creando…', async () => {
    const { data, error } = await sb.auth.signUp({ email, password });
    if(error){ msg.innerHTML = `<div class="aviso">${error.message}</div>`; return; }
    if(data.session){
      msg.innerHTML = '<div class="ok">Cuenta creada y sesión iniciada.</div>';
    } else {
      msg.innerHTML = '<div class="aviso">Cuenta creada, pero Supabase pide confirmar el email antes de poder entrar. Si no quieres depender del correo, desactiva "Confirm email" en Authentication → Providers → Email del dashboard de Supabase, y vuelve a intentarlo.</div>';
    }
  });
}
async function cerrarSesion(){ await sb.auth.signOut(); location.reload(); }
async function cambiarContrasena(){
  const actual = prompt('Introduce tu contraseña actual (para confirmar que eres tú):');
  if(!actual) return;
  const { error: errActual } = await sb.auth.signInWithPassword({ email: EMAIL_AUTORIZADO, password: actual });
  if(errActual){ alert('La contraseña actual no es correcta.'); return; }
  const nueva = prompt('Nueva contraseña (mínimo 6 caracteres):');
  if(!nueva) return;
  if(nueva.length < 6){ alert('Debe tener al menos 6 caracteres.'); return; }
  const { error } = await sb.auth.updateUser({ password: nueva });
  if(error) return alert(error.message);
  alert('Contraseña actualizada.');
}

async function initAuth(){
  const { data:{ session } } = await sb.auth.getSession();
  SESSION = session;
  sb.auth.onAuthStateChange((_evt, s) => { SESSION = s; pintarAuth(); });
  pintarAuth();
}
function pintarAuth(){
  const emailSesion = (SESSION && SESSION.user && SESSION.user.email || '').trim().toLowerCase();
  const logueado = emailSesion && emailSesion === EMAIL_AUTORIZADO.toLowerCase();
  document.getElementById('auth-gate').classList.toggle('oculto', !!logueado);
  document.getElementById('app').classList.toggle('oculto', !logueado);
  if (logueado) cargarTodo();
  else if (emailSesion && emailSesion !== EMAIL_AUTORIZADO.toLowerCase()){
    document.getElementById('auth-msg').innerHTML =
      `<div class="aviso">El email con el que has entrado (${emailSesion}) no coincide con el autorizado (${EMAIL_AUTORIZADO}).</div>`;
  }
}

/* ============================================================
   CARGA DE DATOS
   ============================================================ */
async function cargarTodo(){
  await Promise.all([cargarTiposJugador(), cargarTiposPartido()]);
  await cargarJugadores();
  await cargarPartidos();
  actualizarBotonPartidoActual();
  const vistaGuardada = leerVistaGuardada();
  const partidoGuardado = leerPartidoActualId();
  if(vistaGuardada === 'partido-detalle' && partidoGuardado && PARTIDOS.some(p => p.id === partidoGuardado)){
    await abrirPartido(partidoGuardado);
  } else if(vistaGuardada && ['jugadores','partidos','libro','admin','estadisticas'].includes(vistaGuardada)){
    irA(vistaGuardada);
  } else {
    irA(VISTA);
  }
}
async function cargarJugadores(){
  const { data, error } = await sb.from('alevin_d_jugadores').select('*').order('activo',{ascending:false}).order('dorsal');
  if(!error) JUGADORES = data;
}
async function cargarTiposPartido(){
  const { data, error } = await sb.from('alevin_d_tipos_partido').select('*').order('id');
  if(!error) TIPOS_PARTIDO = data;
}
async function cargarTiposJugador(){
  const { data, error } = await sb.from('alevin_d_tipos_jugador').select('*').order('id');
  if(!error) TIPOS_JUGADOR = data;
}
function nombreTipoJugador(j){
  return TIPOS_JUGADOR.find(t => t.id === j.tipo_jugador_id)?.nombre ?? '?';
}
function idTipoJugadorFijo(){
  return TIPOS_JUGADOR.find(t => t.nombre === 'Fijo')?.id;
}
function idTipoJugadorTemporal(){
  return TIPOS_JUGADOR.find(t => t.nombre === 'Temporal')?.id;
}
async function cargarPartidos(){
  const { data, error } = await sb.from('alevin_d_partidos').select('*, alevin_d_tipos_partido(nombre)').order('fecha',{ascending:false});
  if(!error) PARTIDOS = data;
  const { data: cuartosResumen } = await sb.from('alevin_d_cuartos').select('partido_id, goles_equipo, goles_rival');
  RESUMEN_CUARTOS_POR_PARTIDO = {};
  (cuartosResumen || []).forEach(c => {
    if(!RESUMEN_CUARTOS_POR_PARTIDO[c.partido_id]) RESUMEN_CUARTOS_POR_PARTIDO[c.partido_id] = { ge:0, gr:0, tiene:false };
    const r = RESUMEN_CUARTOS_POR_PARTIDO[c.partido_id];
    if(c.goles_equipo != null){ r.ge += c.goles_equipo; r.tiene = true; }
    if(c.goles_rival != null){ r.gr += c.goles_rival; r.tiene = true; }
  });
  actualizarBotonPartidoActual();
}

/* ============================================================
   NAVEGACIÓN
   ============================================================ */
function irA(vista){
  VISTA = vista;
  PARTIDO_ACTUAL = null;
  guardarVista(vista);
  ['jugadores','partidos','libro','estadisticas','admin'].forEach(v => {
    document.getElementById('nav-'+v).classList.toggle('activo', v === vista);
  });
  if(vista === 'jugadores') renderJugadores();
  if(vista === 'partidos') renderPartidos();
  if(vista === 'libro') renderLibro();
  if(vista === 'estadisticas') renderEstadisticas();
  if(vista === 'admin') renderAdmin();
  actualizarBotonPartidoActual();
}

/* ============================================================
   JUGADORES
   ============================================================ */
let JUGADOR_EN_EDICION = null; // id del jugador con el panel de edición abierto
let VER_BAJAS = false;

function nombreConAlias(j){
  return j.alias ? `${j.nombre} <span class="muted">(${j.alias})</span>` : j.nombre;
}
function opcionesTiposJugador(seleccionadoId){
  return TIPOS_JUGADOR.map(t => `<option value="${t.id}" ${t.id===seleccionadoId?'selected':''}>${t.nombre}</option>`).join('');
}
function renderJugadores(){
  const main = document.getElementById('main');
  const lista = JUGADORES.filter(j => VER_BAJAS ? !j.activo : j.activo);
  const filas = lista.map(j => {
    const editando = JUGADOR_EN_EDICION === j.id;
    const tipoNombre = nombreTipoJugador(j);
    if(editando){
      return `
        <tr>
          <td colspan="3">
            <div class="fila">
              <div><label>Nombre</label><input id="ej-nombre-${j.id}" value="${j.nombre}"></div>
              <div><label>Alias / apodo</label><input id="ej-alias-${j.id}" value="${j.alias ?? ''}" placeholder="p.ej. Xavi"></div>
              <div><label>Dorsal</label><input id="ej-dorsal-${j.id}" type="number" value="${j.dorsal ?? ''}"></div>
              <div><label>Tipo</label>
                <select id="ej-tipo-${j.id}">${opcionesTiposJugador(j.tipo_jugador_id)}</select>
              </div>
            </div>
            <button class="btn" onclick="guardarEdicionJugador('${j.id}')">Guardar</button>
            <button class="btn sec" onclick="JUGADOR_EN_EDICION=null; renderJugadores();">Cancelar</button>
            <button class="btn danger" onclick="toggleActivoJugador('${j.id}', ${!j.activo})">${j.activo ? 'Dar de baja' : 'Reactivar'}</button>
          </td>
        </tr>`;
    }
    return `
      <tr>
        <td>${j.dorsal ?? '-'}</td>
        <td>${nombreConAlias(j)} ${tipoNombre !== 'Fijo' ? `<span class="badge">${tipoNombre}</span>` : ''}</td>
        <td><button class="btn sec" onclick="JUGADOR_EN_EDICION='${j.id}'; renderJugadores();">Editar</button></td>
      </tr>`;
  }).join('');
  main.innerHTML = `
    <div class="card">
      <h2>Añadir jugador</h2>
      <div class="fila">
        <div><label>Nombre</label><input id="nj-nombre"></div>
        <div><label>Dorsal</label><input id="nj-dorsal" type="number"></div>
        <div><label>Tipo</label>
          <select id="nj-tipo">${opcionesTiposJugador(idTipoJugadorFijo())}</select>
        </div>
      </div>
      <button class="btn" onclick="crearJugador()">Añadir</button>
    </div>
    <div class="card">
      <h2>Plantilla ${VER_BAJAS ? '— dados de baja' : ''}</h2>
      <div class="tabla-wrap"><table>
        <thead><tr><th>Dorsal</th><th>Nombre</th><th></th></tr></thead>
        <tbody>${filas || '<tr><td colspan="3" class="muted">Sin jugadores.</td></tr>'}</tbody>
      </table></div>
      <button class="btn sec" style="margin-top:8px;" onclick="VER_BAJAS=!VER_BAJAS; renderJugadores();">${VER_BAJAS ? '← Ver plantilla activa' : 'Ver dados de baja'}</button>
    </div>`;
}
async function crearJugador(){
  const nombre = document.getElementById('nj-nombre').value.trim();
  const dorsalRaw = document.getElementById('nj-dorsal').value;
  const tipo_jugador_id = parseInt(document.getElementById('nj-tipo').value);
  if(!nombre) return alert('Falta el nombre');
  const { error } = await sb.from('alevin_d_jugadores').insert({
    nombre, dorsal: dorsalRaw ? parseInt(dorsalRaw) : null, tipo_jugador_id
  });
  if(error) return alert(error.message);
  await cargarJugadores();
  renderJugadores();
}
async function guardarEdicionJugador(id){
  const nombre = document.getElementById(`ej-nombre-${id}`).value.trim();
  const alias = document.getElementById(`ej-alias-${id}`).value.trim();
  const dorsalRaw = document.getElementById(`ej-dorsal-${id}`).value;
  const tipo_jugador_id = parseInt(document.getElementById(`ej-tipo-${id}`).value);
  if(!nombre) return alert('Falta el nombre');
  const { error } = await sb.from('alevin_d_jugadores').update({
    nombre, alias: alias || null, dorsal: dorsalRaw ? parseInt(dorsalRaw) : null, tipo_jugador_id
  }).eq('id', id);
  if(error) return alert(error.message);
  JUGADOR_EN_EDICION = null;
  await cargarJugadores();
  renderJugadores();
}
async function toggleActivoJugador(id, nuevoValor){
  const { error } = await sb.from('alevin_d_jugadores').update({ activo: nuevoValor }).eq('id', id);
  if(error) return alert(error.message);
  JUGADOR_EN_EDICION = null;
  await cargarJugadores();
  renderJugadores();
}

/* ============================================================
   PARTIDOS — listado y alta
   ============================================================ */
function renderPartidos(){
  if(PARTIDO_ACTUAL) return renderPartidoDetalle();
  const main = document.getElementById('main');
  const ultimoTipo = leerUltimoTipoPartido();
  const opcionesTipo = TIPOS_PARTIDO.map(t => `<option value="${t.id}" ${String(t.id)===ultimoTipo?'selected':''}>${t.nombre}</option>`).join('');
  const items = PARTIDOS.map(p => {
    const resumen = RESUMEN_CUARTOS_POR_PARTIDO[p.id];
    let resultadoHtml = '';
    if(p.goles_favor!=null && p.goles_contra!=null){
      resultadoHtml = `<span class="muted"> · Resultado: ${p.goles_favor} - ${p.goles_contra}</span>`;
    } else if(resumen && resumen.tiene){
      resultadoHtml = `<span class="muted"> · Parcial (cuartos): ${resumen.ge} - ${resumen.gr}</span>`;
    }
    const destacado = leerPartidoActualId() === p.id ? 'style="border-left:3px solid var(--azul);padding-left:9px;"' : '';
    return `

      — ${p.fecha}${p.hora ? ' · '+p.hora : ''} ${p.condicion ? '('+p.condicion+')' : ''}
      ${resultadoHtml}
    </div>`;
  }).join('') || '<p class="muted">Aún no hay partidos.</p>';
  main.innerHTML = `
    <div class="card">

      <div class="fila">
        <div><label>Rival</label><input id="np-rival"></div>
        <div><label>Fecha</label><input id="np-fecha" type="date"></div>

      </div>
      <div class="fila">

        <div><label>Tipo de partido</label>
          <select id="np-tipo">${opcionesTipo}</select>
        </div>
        <div><label>&nbsp;</label>
          <button class="btn sec" onclick="nuevoTipoPartido()" type="button">+ Nuevo tipo</button>
        </div>
      </div>
      <button class="btn" onclick="crearPartido(this)">Crear partido</button>
    </div>
    <div class="card">
      <h2>Partidos</h2>
      ${items}
    </div>`;
}
async function nuevoTipoPartido(){
  const nombre = prompt('Nombre del nuevo tipo de partido (p.ej. "Copa"):');
  if(!nombre) return;
  const { error } = await sb.from('alevin_d_tipos_partido').insert({ nombre });
  if(error) return alert(error.message);
  await cargarTiposPartido();
  renderPartidos();
}
async function crearPartido(boton){
  const rival = document.getElementById('np-rival').value.trim();
  const fecha = document.getElementById('np-fecha').value;
  const hora = document.getElementById('np-hora').value || null;
  const condicion = document.getElementById('np-condicion').value;
  const tipo_partido_id = parseInt(document.getElementById('np-tipo').value);
  if(!rival || !fecha) return alert('Rival y fecha son obligatorios');
  await conSpinner(boton, 'Creando…', async () => {
    const { data, error } = await sb.from('alevin_d_partidos')
      .insert({ rival, fecha, hora, condicion, tipo_partido_id }).select().single();
    if(error) return alert(error.message);
    guardarUltimoTipoPartido(tipo_partido_id);
    // Convocatoria por defecto: solo los jugadores fijos activos (los temporales
    // se añaden y marcan a mano en cada partido). Se desmarcan los que falten.
    const idFijo = idTipoJugadorFijo();
    const activosFijos = JUGADORES.filter(j => j.activo && j.tipo_jugador_id === idFijo);
    if(activosFijos.length){
      const { error: e2 } = await sb.from('alevin_d_convocatoria')
        .insert(activosFijos.map(j => ({ partido_id: data.id, jugador_id: j.id })));
      if(e2) return alert(e2.message);
    }
    await cargarPartidos();
    await abrirPartido(data.id);
  });
}

/* ============================================================
   PARTIDO — detalle (convocatoria, foto, 4 cuartos)
   ============================================================ */
let DETALLE = null; // { partido, convocatoria:[{jugador_id,dorsal_partido,jugador}], cuartos:{1:{...},2:...} }

async function abrirPartido(id){
  PARTIDO_ACTUAL = id;
  guardarPartidoActualId(id);
  guardarVista('partido-detalle');
  VISTA = 'partidos';
  document.getElementById('nav-partidos').classList.add('activo');
  document.getElementById('nav-jugadores').classList.remove('activo');
  document.getElementById('nav-libro').classList.remove('activo');
  document.getElementById('nav-estadisticas').classList.remove('activo');
  actualizarBotonPartidoActual();
  DETALLE = null;
  renderPartidoDetalle(); // muestra "Cargando…" mientras llegan los datos
  await cargarDetallePartido(id);
  renderPartidoDetalle();
}
async function cargarDetallePartido(id){
  // Todo en paralelo (antes se pedía 1 fila por cuarto en serie: hasta 9
  // idas y vueltas seguidas — esto era la causa de la lentitud al abrir un partido).
  const partidoLocal = PARTIDOS.find(p => p.id === id);
  const [partidoRes, convRes, cuartosRes] = await Promise.all([
    partidoLocal ? Promise.resolve({ data: partidoLocal }) : sb.from('alevin_d_partidos').select('*, alevin_d_tipos_partido(nombre)').eq('id', id).single(),
    sb.from('alevin_d_convocatoria').select('*, alevin_d_jugadores(*)').eq('partido_id', id),
    sb.from('alevin_d_cuartos').select('*').eq('partido_id', id).order('numero')
  ]);
  const partido = partidoRes.data;
  const conv = convRes.data;
  const cuartosRows = cuartosRes.data || [];
  const idsCuartos = cuartosRows.map(c => c.id);

  let alineacionesTodas = [], golesTodos = [];
  if(idsCuartos.length){
    const [alRes, glRes] = await Promise.all([
      sb.from('alevin_d_alineacion_cuarto').select('*, alevin_d_jugadores(nombre)').in('cuarto_id', idsCuartos),
      sb.from('alevin_d_goles').select('*, autor:alevin_d_jugadores!alevin_d_goles_jugador_id_fkey(nombre), asistente:alevin_d_jugadores!alevin_d_goles_asistente_id_fkey(nombre)').in('cuarto_id', idsCuartos)
    ]);
    alineacionesTodas = alRes.data || [];
    golesTodos = glRes.data || [];
  }

  const cuartos = {};
  for (let n=1; n<=4; n++){
    const row = cuartosRows.find(c => c.numero === n);
    cuartos[n] = {
      row,
      alineacion: row ? alineacionesTodas.filter(a => a.cuarto_id === row.id) : [],
      goles: row ? golesTodos.filter(g => g.cuarto_id === row.id) : []
    };
  }
  let fotoUrl = null;
  if(partido && partido.foto_convocatoria_path){
    const { data: firmada } = await sb.storage.from('alevin-d-fotos').createSignedUrl(partido.foto_convocatoria_path, 3600);
    fotoUrl = firmada?.signedUrl || null;
  }
  DETALLE = { partido, convocatoria: conv || [], cuartos, fotoUrl };
}
function jugadorPorId(id){ return JUGADORES.find(j => j.id === id); }

function totalCuartos(){
  let ge = 0, gr = 0, tiene = false;
  for(let n=1; n<=4; n++){
    const row = DETALLE.cuartos[n].row;
    if(row){
      if(row.goles_equipo != null){ ge += row.goles_equipo; tiene = true; }
      if(row.goles_rival != null){ gr += row.goles_rival; tiene = true; }
    }
  }
  return tiene ? { ge, gr } : null;
}
function renderPartidoDetalle(){
  const main = document.getElementById('main');
  if(!DETALLE){ main.innerHTML = '<p class="muted">Cargando…</p>'; return; }
  const p = DETALLE.partido;
  const convocados = new Set(DETALLE.convocatoria.map(c => c.jugador_id));
  const activos = JUGADORES.filter(j => j.activo || convocados.has(j.id));
  const todosMarcados = activos.length > 0 && activos.every(j => convocados.has(j.id));
  const filasJugadores = activos.map(j => `
    <label style="display:flex;align-items:center;gap:8px;font-weight:normal;padding:5px 8px;border:1px solid var(--borde);border-radius:6px;background:${convocados.has(j.id)?'#eff6ff':'#fff'};">
      <input type="checkbox" ${convocados.has(j.id)?'checked':''} onchange="toggleConvocado('${j.id}', this.checked)">
      <span>${j.dorsal ?? '-'} · ${nombreConAlias(j)}</span>
    </label>`).join('');

  let cuartosHtml = '';
  for(let n=1; n<=4; n++) cuartosHtml += renderCuarto(n);

  const total = totalCuartos();
  const totalHtml = total
    ? `<p class="resultado-total">⚽ ${total.ge} - ${total.gr} <span class="muted" style="font-size:13px;font-weight:400;">(suma de cuartos)</span></p>`
    : '';

  main.innerHTML = `
    <button class="volver" onclick="irA('partidos')">← Volver a partidos</button>
    <div class="card">
      <div>
        <h2 style="margin-bottom:2px;">${p.rival} — ${p.fecha}</h2>
        <p class="muted" style="margin-top:0;">${p.alevin_d_tipos_partido?.nombre ?? ''} · ${p.condicion ?? ''} ${p.hora ? '· '+p.hora : ''}</p>
        ${totalHtml}
      </div>
      <div class="fila">
        <div><label>Goles a favor (resultado oficial)</label><input id="pd-gf" type="number" value="${p.goles_favor ?? ''}"></div>
        <div><label>Goles en contra (resultado oficial)</label><input id="pd-gc" type="number" value="${p.goles_contra ?? ''}"></div>
        <div style="align-self:flex-end;"><button class="btn sec" onclick="guardarResultadoFinal(this)">Guardar resultado</button></div>
      </div>
      <h3>Foto de convocatoria</h3>
      <input type="file" id="pd-foto" accept="image/*" onchange="subirFotoConvocatoria(this.files[0])">
      <p id="pd-foto-estado" class="muted"></p>
      ${DETALLE.fotoUrl ? `<p><img src="${DETALLE.fotoUrl}" alt="Foto de convocatoria" style="max-width:100%;border-radius:6px;margin-top:8px;"></p>` : ''}
      <details style="margin-top:14px;">
        <summary class="muted" style="cursor:pointer;font-size:12px;">Opciones avanzadas</summary>
        <button class="btn danger" style="margin-top:8px;font-size:12px;padding:4px 10px;" onclick="eliminarPartido(this)">Eliminar partido</button>
      </details>
    </div>
    <div class="card">
      <h3>Convocatoria</h3>
      <button class="btn sec" style="margin-bottom:8px;" onclick="toggleTodosConvocados(${todosMarcados}, this)">${todosMarcados ? 'Desmarcar todos' : 'Marcar todos'}</button>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px;">${filasJugadores}</div>
      <div class="fila" style="margin-top:10px;">
        <div><input id="pd-temporal-nombre" placeholder="Nombre jugador temporal"></div>
        <div><input id="pd-temporal-dorsal" type="number" placeholder="Dorsal (opcional)"></div>
        <div><button class="btn sec" onclick="anadirTemporalYConvocar(this)">+ Añadir temporal y convocar</button></div>
      </div>
    </div>
    ${cuartosHtml}
  `;
}
async function eliminarPartido(boton){
  if(!confirm(`¿Eliminar el partido contra ${DETALLE.partido.rival} (${DETALLE.partido.fecha})? Se borrarán también sus cuartos, alineaciones y goles. Esta acción no se puede deshacer.`)) return;
  await conSpinner(boton, 'Eliminando…', async () => {
    const { error } = await sb.from('alevin_d_partidos').delete().eq('id', PARTIDO_ACTUAL);
    if(error) return alert(error.message);
    if(leerPartidoActualId() === PARTIDO_ACTUAL){
      try{ localStorage.removeItem('alevin_d_partido_actual_id'); }catch(e){}
    }
    await cargarPartidos();
    irA('partidos');
  });
}
async function guardarResultadoFinal(boton){
  const gf = document.getElementById('pd-gf').value;
  const gc = document.getElementById('pd-gc').value;
  await conSpinner(boton, 'Guardando…', async () => {
    const { error } = await sb.from('alevin_d_partidos').update({
      goles_favor: gf === '' ? null : parseInt(gf),
      goles_contra: gc === '' ? null : parseInt(gc)
    }).eq('id', PARTIDO_ACTUAL);
    if(error) return alert(error.message);
    await cargarPartidos();
  });
}
async function toggleConvocado(jugadorId, marcado){
  if(marcado){
    const { error } = await sb.from('alevin_d_convocatoria').insert({ partido_id: PARTIDO_ACTUAL, jugador_id: jugadorId });
    if(error) return alert(error.message);
  } else {
    const { error } = await sb.from('alevin_d_convocatoria').delete().eq('partido_id', PARTIDO_ACTUAL).eq('jugador_id', jugadorId);
    if(error) return alert(error.message);
  }
  await cargarDetallePartido(PARTIDO_ACTUAL);
  renderPartidoDetalle();
}
async function toggleTodosConvocados(desmarcar, boton){
  await conSpinner(boton, '…', async () => {
    if(desmarcar){
      const { error } = await sb.from('alevin_d_convocatoria').delete().eq('partido_id', PARTIDO_ACTUAL);
      if(error) return alert(error.message);
    } else {
      const yaConvocados = new Set(DETALLE.convocatoria.map(c => c.jugador_id));
      const faltan = JUGADORES.filter(j => j.activo && !yaConvocados.has(j.id));
      if(faltan.length){
        const { error } = await sb.from('alevin_d_convocatoria')
          .insert(faltan.map(j => ({ partido_id: PARTIDO_ACTUAL, jugador_id: j.id })));
        if(error) return alert(error.message);
      }
    }
    await cargarDetallePartido(PARTIDO_ACTUAL);
    renderPartidoDetalle();
  });
}
async function anadirTemporalYConvocar(boton){

    }).select().single();

    const { error: e2 } = await sb.from('alevin_d_convocatoria').insert({ partido_id: PARTIDO_ACTUAL, jugador_id: data.id, dorsal_partido: dorsalRaw?parseInt(dorsalRaw):null });

async function subirFotoConvocatoria(file){
  if(!file) return;
  const estado = document.getElementById('pd-foto-estado');
  if(estado) estado.innerHTML = '<span class="spinner" style="border-color:#777;"></span>Subiendo foto…';
  const ext = file.name.split('.').pop();
  const path = `${PARTIDO_ACTUAL}/convocatoria.${ext}`;
  const { error } = await sb.storage.from('alevin-d-fotos').upload(path, file, { upsert: true });
  if(error){ if(estado) estado.textContent = ''; return alert(error.message); }
  const { error: e2 } = await sb.from('alevin_d_partidos').update({ foto_convocatoria_path: path }).eq('id', PARTIDO_ACTUAL);

  await cargarDetallePartido(PARTIDO_ACTUAL);

/* ============================================================
   CUARTOS — líneas, cálculo de posiciones, goles/asistencias
   ============================================================ */
// Estado temporal de edición de líneas por cuarto (no persistido hasta "Guardar")
const EDICION_CUARTO = {}; // { [numero]: { portero:[jugador_id], defensa:[...], medio:[...], media_punta:[...], delantero:[...] } }

function jugadoresConvocados(){
  return DETALLE.convocatoria.map(c => c.alevin_d_jugadores).filter(Boolean);
}
function iniciarEdicionCuarto(n){
  if(EDICION_CUARTO[n]) return;
  const c = DETALLE.cuartos[n];
  const porLinea = { portero:[], defensa:[], medio:[], media_punta:[], delantero:[] };
  (c.alineacion||[]).slice().sort((a,b)=>a.orden_en_linea-b.orden_en_linea).forEach(a => {
    porLinea[a.linea].push(a.jugador_id);
  });
  EDICION_CUARTO[n] = porLinea;
}
let CUARTOS_ABIERTOS = new Set();
// Cuartos cuya alineación ya guardada se está reeditando (si no está aquí y
// ya tiene alineación guardada, se muestra la vista de campo en vez del editor).
let EDITANDO_CUARTO = new Set();

function renderCuarto(n){
  const c = DETALLE.cuartos[n];
  const tieneAlineacion = (c.alineacion || []).length > 0;
  const editando = EDITANDO_CUARTO.has(n) || !tieneAlineacion;
  if(editando) iniciarEdicionCuarto(n);

  const resumen = c.row
    ? `${(c.row.goles_equipo ?? '?')} - ${(c.row.goles_rival ?? '?')} · ${c.goles.length} gol(es)`
    : 'sin datos guardados';

  const cuerpoAlineacion = editando ? renderEditorLineasCuarto(n) : renderCampoCuarto(n);
  const golesHtml = renderGolesCuarto(n);

  return `
    <details class="card" style="padding:0;" ${CUARTOS_ABIERTOS.has(n) ? 'open' : ''} ontoggle="if(this.open) CUARTOS_ABIERTOS.add(${n}); else CUARTOS_ABIERTOS.delete(${n});">
      <summary style="cursor:pointer;padding:16px;font-weight:600;font-size:15px;">Cuarto ${n} <span class="muted" style="font-weight:normal;">— ${resumen}</span></summary>
      <div style="padding:0 16px 16px;">
        <div class="fila">
          <div><label>Goles equipo</label>
            <div style="display:flex;gap:6px;align-items:center;">
              <input id="cq-ge-${n}" type="number" value="${c.row?.goles_equipo ?? ''}" style="flex:1;">
              <button type="button" class="btn sec" onclick="incrementarMarcador(${n}, 'goles_equipo', 1)">+1</button>
              <button type="button" class="btn sec" onclick="incrementarMarcador(${n}, 'goles_equipo', -1)">-1</button>
            </div>
          </div>
          <div><label>Goles rival</label>
            <div style="display:flex;gap:6px;align-items:center;">
              <input id="cq-gr-${n}" type="number" value="${c.row?.goles_rival ?? ''}" style="flex:1;">
              <button type="button" class="btn sec" onclick="incrementarMarcador(${n}, 'goles_rival', 1)">+1</button>
              <button type="button" class="btn sec" onclick="incrementarMarcador(${n}, 'goles_rival', -1)">-1</button>
            </div>
          </div>
        </div>
        <h4 style="margin-bottom:4px;">Alineación</h4>
        ${cuerpoAlineacion}
        ${golesHtml}
      </div>
    </details>`;
}

// Vista de campo: solo lectura, para cuando la alineación de ese cuarto ya
// está guardada — con botón de gol rápido junto a cada jugador.
function renderCampoCuarto(n){
  const c = DETALLE.cuartos[n];
  const porLinea = { portero:[], defensa:[], medio:[], media_punta:[], delantero:[] };
  (c.alineacion||[]).slice().sort((a,b)=>a.orden_en_linea-b.orden_en_linea).forEach(a => {
    porLinea[a.linea].push(a);
  });
  // Orden visual de arriba a abajo: delantero primero, portero al final (abajo),
  // para que se lea como un campo real con la portería propia en la parte de abajo.
  const ordenVisual = ['delantero','media_punta','medio','defensa','portero'];
  const filas = ordenVisual.map(linea => {
    const jugadoresLinea = porLinea[linea];
    if(!jugadoresLinea.length) return '';
    const pastillas = jugadoresLinea.map(a => `
      <div class="campo-jugador">
        <div class="cod">${a.posicion_codigo || '?'}</div>
        <div class="nom">${a.alevin_d_jugadores?.nombre ?? '?'}</div>
      </div>`).join('');
    return `<div class="campo-linea">${pastillas}</div>`;
  }).join('');
  return `
    <div class="campo">${filas || '<p class="muted" style="color:#fff;text-align:center;margin:0;">Sin alineación guardada.</p>'}</div>
    <button class="btn sec" onclick="EDITANDO_CUARTO.add(${n}); renderPartidoDetalle();">✏️ Editar alineación</button>`;
}

// Editor de líneas (el formulario clásico de añadir/quitar jugadores por línea).
function renderEditorLineasCuarto(n){
  const c = DETALLE.cuartos[n];
  const edicion = EDICION_CUARTO[n];
  const convocados = jugadoresConvocados();
  const cuartoGuardado = !!c.row;

  const lineasHtml = Object.keys(NOMBRE_LINEA).map(linea => {
    const seleccion = edicion[linea];
    const codigos = calcularCodigos(linea, seleccion.length) || [];
    const chips = seleccion.map((jid, idx) => {
      const j = jugadorPorId(jid);
      const codigo = codigos[idx] || '';
      const golBtn = cuartoGuardado ? `<button type="button" class="gol-rapido" title="Registrar gol de este jugador" onclick="golRapido(${n}, '${jid}')">⚽</button>` : '';
      return `<span class="chip">${j ? j.nombre : '?'}
        <input type="text" value="${codigo}" data-linea="${linea}" data-idx="${idx}" onchange="codigoManual(${n}, this)" title="código de posición (editable)">
        ${golBtn}
        <button type="button" class="chip-x" onclick="quitarDeLinea(${n}, '${linea}', ${idx})">×</button>
      </span>`;
    }).join('');
    const avisoSinTabla = seleccion.length > 0 && !calcularCodigos(linea, seleccion.length)
      ? `<p class="muted">Sin regla automática para ${seleccion.length} jugador(es) en esta línea — edita los códigos a mano.</p>` : '';
    const opciones = convocados
      .filter(j => !seleccion.includes(j.id))
      .map(j => `<option value="${j.id}">${j.nombre}</option>`).join('');
    const notaPortero = (linea === 'portero' && seleccion.length === 0)
      ? '<p class="muted">Vacío = se mantiene el mismo portero que en el cuarto anterior.</p>' : '';
    return `
      <div class="linea-box">
        <strong>${NOMBRE_LINEA[linea]}</strong>
        <div class="chips">${chips || '<span class="muted">— sin jugadores —</span>'}</div>
        ${avisoSinTabla}${notaPortero}
        <select onchange="anadirALinea(${n}, '${linea}', this.value); this.value='';">
          <option value="">+ añadir jugador…</option>
          ${opciones}
        </select>
      </div>`;
  }).join('');

  return `
    ${lineasHtml}
    <button class="btn" onclick="guardarCuarto(${n}, this)">Guardar alineación del cuarto ${n}</button>
    ${cuartoGuardado ? `<button class="btn sec" onclick="EDITANDO_CUARTO.delete(${n}); delete EDICION_CUARTO[${n}]; renderPartidoDetalle();">Cancelar edición</button>` : ''}`;
}

function renderGolesCuarto(n){
  const c = DETALLE.cuartos[n];
  const convocados = jugadoresConvocados();
  const goles = c.goles.map(g => `
    <li>⚽ <strong>${g.autor?.nombre ?? '?'}</strong> ${g.asistente ? `<span class="muted">(asistencia: ${g.asistente.nombre})</span>` : ''}
      <button class="chip-x" onclick="borrarGol('${g.id}', ${n})">×</button>
    </li>`).join('');
  const opcionesGoleador = convocados.map(j => `<option value="${j.id}">${j.nombre}</option>`).join('');
  return `
    <div class="linea-box" style="margin-top:16px;border-style:solid;">
      <strong>⚽ Goles de este cuarto</strong>
      <ul style="margin:8px 0;padding-left:20px;">${goles || '<li class="muted">Sin goles registrados</li>'}</ul>
      <div class="fila">
        <div><label>Goleador</label><select id="gol-autor-${n}"><option value="">—</option>${opcionesGoleador}</select></div>
        <div><label>Asistente (opcional)</label><select id="gol-asist-${n}"><option value="">—</option>${opcionesGoleador}</select></div>
        <div style="align-self:flex-end;"><button class="btn sec" onclick="anadirGol(${n}, this)">+ Añadir gol</button></div>
      </div>
      ${!c.row ? '<p class="muted">Guarda primero la alineación de este cuarto para poder registrar goles.</p>' : ''}
    </div>`;
}

function anadirALinea(n, linea, jugadorId){
  if(!jugadorId) return;
  EDICION_CUARTO[n][linea].push(jugadorId);
  renderPartidoDetalle();
}
function quitarDeLinea(n, linea, idx){
  EDICION_CUARTO[n][linea].splice(idx, 1);
  renderPartidoDetalle();
}
function codigoManual(n, input){
  // El valor se lee directamente del input al guardar; no hace falta
  // guardar estado intermedio, solo evitar que el re-render lo pierda
  // antes de tiempo (guardarCuarto lee el DOM).
}

// Botones +1 / -1 del marcador del cuarto. Si el cuarto ya existe en BD, se
// guarda al momento; si aún no se ha creado (primer guardado pendiente), solo
// actualiza el campo del formulario y quedará guardado al pulsar "Guardar".
async function incrementarMarcador(n, campoDb, delta){
  const inputId = campoDb === 'goles_equipo' ? `cq-ge-${n}` : `cq-gr-${n}`;
  const input = document.getElementById(inputId);
  if(!input) return;
  const actual = parseInt(input.value) || 0;
  const nuevo = Math.max(0, actual + delta);
  input.value = nuevo;
  const cuartoId = DETALLE.cuartos[n].row?.id;
  if(!cuartoId) return; // se guardará junto con la alineación
  const { error } = await sb.from('alevin_d_cuartos').update({ [campoDb]: nuevo }).eq('id', cuartoId);
  if(error) return alert(error.message);
  DETALLE.cuartos[n].row[campoDb] = nuevo;
  renderPartidoDetalle();
}

async function guardarCuarto(n, boton){
  await conSpinner(boton, 'Guardando…', async () => {
    const edicion = EDICION_CUARTO[n];
    let cuartoId = DETALLE.cuartos[n].row?.id;

    // Portero: si no se ha puesto ninguno, heredar el del cuarto anterior
    let porteroId = edicion.portero[0];
    if(!porteroId){
      for(let prev = n-1; prev >= 1; prev--){
        const anterior = (DETALLE.cuartos[prev].alineacion||[]).find(a => a.linea === 'portero');
        if(anterior){ porteroId = anterior.jugador_id; break; }
      }
    }

    const ge = document.getElementById(`cq-ge-${n}`).value;
    const gr = document.getElementById(`cq-gr-${n}`).value;

    if(!cuartoId){
      const { data, error } = await sb.from('alevin_d_cuartos').insert({
        partido_id: PARTIDO_ACTUAL, numero: n,
        goles_equipo: ge===''?null:parseInt(ge), goles_rival: gr===''?null:parseInt(gr)
      }).select().single();
      if(error) return alert(error.message);
      cuartoId = data.id;
    } else {
      const { error } = await sb.from('alevin_d_cuartos').update({
        goles_equipo: ge===''?null:parseInt(ge), goles_rival: gr===''?null:parseInt(gr)
      }).eq('id', cuartoId);
      if(error) return alert(error.message);
    }

    // Reconstruir alineación completa del cuarto
    await sb.from('alevin_d_alineacion_cuarto').delete().eq('cuarto_id', cuartoId);
    const filas = [];
    Object.keys(NOMBRE_LINEA).forEach(linea => {
      let jugadoresLinea = edicion[linea];
      if(linea === 'portero'){
        jugadoresLinea = porteroId ? [porteroId] : [];
      }
      jugadoresLinea.forEach((jid, idx) => {
        const inputCodigo = document.querySelector(`input[data-linea="${linea}"][data-idx="${idx}"]`);
        const codigos = calcularCodigos(linea, jugadoresLinea.length);
        const codigo = (inputCodigo && inputCodigo.value.trim()) || (codigos ? codigos[idx] : '?');
        filas.push({ cuarto_id: cuartoId, jugador_id: jid, linea, orden_en_linea: idx+1, posicion_codigo: codigo });
      });
    });
    if(filas.length){
      const { error } = await sb.from('alevin_d_alineacion_cuarto').insert(filas);
      if(error) return alert(error.message);
    }
    delete EDICION_CUARTO[n];
    EDITANDO_CUARTO.delete(n); // al guardar, pasa a mostrarse como campo (colapsa el editor)
    await cargarDetallePartido(PARTIDO_ACTUAL);
    renderPartidoDetalle();
  });
}

async function golRapido(n, jugadorId){
  const cuartoId = DETALLE.cuartos[n].row?.id;
  if(!cuartoId) return alert('Guarda antes la alineación del cuarto para poder registrar goles.');
  const { error } = await sb.from('alevin_d_goles').insert({ cuarto_id: cuartoId, jugador_id: jugadorId });
  if(error) return alert(error.message);
  await cargarDetallePartido(PARTIDO_ACTUAL);
  renderPartidoDetalle();
}
async function anadirGol(n, boton){
  const cuartoId = DETALLE.cuartos[n].row?.id;
  if(!cuartoId) return alert('Guarda antes la alineación del cuarto para poder registrar goles.');
  const autor = document.getElementById(`gol-autor-${n}`).value;
  const asistente = document.getElementById(`gol-asist-${n}`).value || null;
  if(!autor) return alert('Falta el goleador');
  await conSpinner(boton, 'Guardando…', async () => {
    const { error } = await sb.from('alevin_d_goles').insert({ cuarto_id: cuartoId, jugador_id: autor, asistente_id: asistente });
    if(error) return alert(error.message);
    await cargarDetallePartido(PARTIDO_ACTUAL);
    renderPartidoDetalle();
  });
}
async function borrarGol(id, n){
  const { error } = await sb.from('alevin_d_goles').delete().eq('id', id);
  if(error) return alert(error.message);
  await cargarDetallePartido(PARTIDO_ACTUAL);
  renderPartidoDetalle();
}

/* ============================================================
   LIBRO — datos de todos los partidos, para la futura generación
   del PDF; de momento se muestra como vista previa en la propia app.
   ============================================================ */
async function cargarDatosLibro(){
  const idsPartidos = PARTIDOS.map(p => p.id);
  if(!idsPartidos.length) return { cuartosPorPartido: {} };
  const { data: cuartos } = await sb.from('alevin_d_cuartos').select('*').in('partido_id', idsPartidos).order('numero');
  const idsCuartos = (cuartos||[]).map(c => c.id);
  let alineaciones = [], goles = [];
  if(idsCuartos.length){
    const [alRes, glRes] = await Promise.all([
      sb.from('alevin_d_alineacion_cuarto').select('*, alevin_d_jugadores(nombre)').in('cuarto_id', idsCuartos),
      sb.from('alevin_d_goles').select('*, autor:alevin_d_jugadores!alevin_d_goles_jugador_id_fkey(nombre), asistente:alevin_d_jugadores!alevin_d_goles_asistente_id_fkey(nombre)').in('cuarto_id', idsCuartos)
    ]);
    alineaciones = alRes.data || [];
    goles = glRes.data || [];
  }
  const cuartosPorPartido = {};
  (cuartos||[]).forEach(c => {
    if(!cuartosPorPartido[c.partido_id]) cuartosPorPartido[c.partido_id] = [];
    cuartosPorPartido[c.partido_id].push({
      ...c,
      alineacion: alineaciones.filter(a => a.cuarto_id === c.id),
      goles: goles.filter(g => g.cuarto_id === c.id)
    });
  });
  return { cuartosPorPartido };
}
async function renderLibro(){
  const main = document.getElementById('main');
  main.innerHTML = '<p class="muted">Cargando libro de temporada…</p>';
  const { cuartosPorPartido } = await cargarDatosLibro();
  const partidosOrdenados = PARTIDOS.slice().sort((a,b) => (a.fecha||'').localeCompare(b.fecha||''));
  const secciones = partidosOrdenados.map(p => {
    const cuartos = (cuartosPorPartido[p.id] || []).sort((a,b) => a.numero - b.numero);
    const totalGe = cuartos.reduce((s,c)=> s + (c.goles_equipo||0), 0);
    const totalGr = cuartos.reduce((s,c)=> s + (c.goles_rival||0), 0);
    const hayDatosCuartos = cuartos.some(c => c.goles_equipo != null || c.goles_rival != null);
    const resultadoTexto = (p.goles_favor!=null && p.goles_contra!=null)
      ? `Resultado oficial: ${p.goles_favor} - ${p.goles_contra}`
      : (hayDatosCuartos ? `Resultado (según cuartos): ${totalGe} - ${totalGr}` : 'Resultado: sin datos');
    const cuartosHtml = cuartos.map(c => {
      const porLinea = {};
      c.alineacion.forEach(a => {
        if(!porLinea[a.linea]) porLinea[a.linea] = [];
        porLinea[a.linea].push(a);
      });
      const lineasTexto = Object.keys(NOMBRE_LINEA)
        .filter(l => porLinea[l] && porLinea[l].length)
        .map(l => `<strong>${NOMBRE_LINEA[l]}:</strong> ` + porLinea[l].slice().sort((a,b)=>a.orden_en_linea-b.orden_en_linea).map(a => `${a.posicion_codigo||'?'} ${a.alevin_d_jugadores?.nombre??'?'}`).join(', '))
        .join('<br>');
      const golesTexto = c.goles.map(g => `⚽ ${g.autor?.nombre??'?'}${g.asistente ? ' (asist. '+g.asistente.nombre+')' : ''}`).join('<br>') || '<span class="muted">Sin goles</span>';
      return `
        <div class="linea-box">
          <strong>Cuarto ${c.numero}</strong> — ${c.goles_equipo ?? '?'} - ${c.goles_rival ?? '?'}
          <p style="margin:6px 0;">${lineasTexto || '<span class="muted">Sin alineación guardada</span>'}</p>
          <p style="margin:6px 0;">${golesTexto}</p>
        </div>`;
    }).join('') || '<p class="muted">Sin cuartos registrados.</p>';
    return `
      <div class="card">
        <h3 style="margin-bottom:4px;">${p.rival} — ${p.fecha} <span class="badge ${(p.alevin_d_tipos_partido?.nombre||'').toLowerCase()}">${p.alevin_d_tipos_partido?.nombre??''}</span></h3>
        <p class="muted" style="margin-top:0;">${p.condicion ?? ''} ${p.hora ? '· '+p.hora : ''} · ${resultadoTexto}</p>
        ${cuartosHtml}
      </div>`;
  }).join('') || '<p class="muted">Aún no hay partidos con los que generar el libro.</p>';

  main.innerHTML = `
    <div class="card">
      <h2>Libro de temporada</h2>
      <p class="muted">Vista previa con todo lo guardado hasta ahora, partido a partido. Es el primer paso hacia el PDF final (que añadirá diseño, estadísticas de la plantilla y la separación amistosos/liga) — de momento sirve para comprobar que la información está completa.</p>
    </div>
    ${secciones}`;
}

/* ============================================================
   ESTADÍSTICAS — cuartos jugados, goles, asistencias y goles
   encajados (para quien jugó de portero), calculado a partir de
   lo guardado en cada cuarto. Sirve también para comprobar que
   todo se está guardando correctamente.
   ============================================================ */
async function cargarEstadisticas(){
  const { data: alineaciones } = await sb
    .from('alevin_d_alineacion_cuarto')
    .select('jugador_id, linea, cuarto_id, alevin_d_cuartos(goles_rival)');
  const { data: goles } = await sb
    .from('alevin_d_goles')
    .select('jugador_id, asistente_id');
  return { alineaciones: alineaciones || [], goles: goles || [] };
}
function calcularEstadisticasJugadores(alineaciones, goles){
  const stats = {};
  function obtener(jid){
    if(!stats[jid]) stats[jid] = { cuartosJugados: new Set(), goles: 0, asistencias: 0, cuartosPortero: new Set(), golesEncajados: 0 };
    return stats[jid];
  }
  alineaciones.forEach(a => {
    const s = obtener(a.jugador_id);
    s.cuartosJugados.add(a.cuarto_id);
    if(a.linea === 'portero'){
      s.cuartosPortero.add(a.cuarto_id);
      const gr = a.alevin_d_cuartos?.goles_rival;
      if(gr != null) s.golesEncajados += gr;
    }
  });
  goles.forEach(g => {
    if(g.jugador_id) obtener(g.jugador_id).goles += 1;
    if(g.asistente_id) obtener(g.asistente_id).asistencias += 1;
  });
  return stats;
}
async function renderEstadisticas(){
  const main = document.getElementById('main');
  main.innerHTML = '<p class="muted">Calculando estadísticas…</p>';
  const { alineaciones, goles } = await cargarEstadisticas();
  const stats = calcularEstadisticasJugadores(alineaciones, goles);
  const filas = JUGADORES
    .slice()
    .sort((a,b) => (b.activo - a.activo) || a.nombre.localeCompare(b.nombre))
    .map(j => {
      const s = stats[j.id];
      if(!s && !j.activo) return ''; // ocultar bajas sin ningún dato histórico
      const cuartosJugados = s ? s.cuartosJugados.size : 0;
      const cuartosPortero = s ? s.cuartosPortero.size : 0;
      const portero = cuartosPortero
        ? `${cuartosPortero} <span class="muted">(${s.golesEncajados} encajados)</span>`
        : '—';
      return `<tr>
        <td>${j.dorsal ?? '-'}</td>
        <td>${nombreConAlias(j)}${!j.activo ? ' <span class="badge">baja</span>' : ''}</td>
        <td>${cuartosJugados}</td>
        <td>${s ? s.goles : 0}</td>
        <td>${s ? s.asistencias : 0}</td>
        <td>${portero}</td>
      </tr>`;
    }).join('');
  main.innerHTML = `
    <div class="card">
      <h2>Estadísticas de la plantilla</h2>
      <p class="muted">Calculadas a partir de los cuartos y goles ya guardados — también sirve para comprobar de un vistazo que todo se está registrando bien.</p>
      <div class="tabla-wrap"><table>
        <thead><tr><th>Dorsal</th><th>Jugador</th><th>Cuartos jugados</th><th>Goles</th><th>Asistencias</th><th>De portero (encajados)</th></tr></thead>
        <tbody>${filas || '<tr><td colspan="6" class="muted">Sin datos todavía.</td></tr>'}</tbody>
      </table></div>
    </div>`;
}

function filasCatalogo(items, enEdicionId, prefijo, fnGuardar, fnEliminar, fnEditar){
  return items.map(t => {
    if(enEdicionId === t.id){
      return `
        <tr>
          <td colspan="2">
            <div class="fila">
              <div><input id="${prefijo}-nombre-${t.id}" value="${t.nombre}"></div>
            </div>
            <button class="btn" onclick="${fnGuardar}(${t.id})">Guardar</button>
            <button class="btn sec" onclick="${fnEditar}(null)">Cancelar</button>
          </td>
        </tr>`;
    }
    return `
      <tr>
        <td>${t.nombre}</td>
        <td>
          <button class="btn sec" onclick="${fnEditar}(${t.id})">Editar</button>
          <button class="btn danger" onclick="${fnEliminar}(${t.id})">Eliminar</button>
        </td>
      </tr>`;
  }).join('');
}
